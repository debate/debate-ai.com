name: Auto-merge PRs and create missing PRs

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed

  schedule:
    # Runs at 00:00 and 12:00 UTC.
    - cron: "0 */12 * * *"

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Claude PR number to process; leave blank to run repository maintenance"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: >-
    auto-merge-pr-${{
      github.event.pull_request.number ||
      inputs.pr_number ||
      'maintenance'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  # Prefer the supplied token; otherwise use the workflow token.
  GH_TOKEN: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Resolve base-branch conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.pr_number != ''
      ) ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.action != 'closed' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.pull_request.user.login == 'claude[bot]' ||
          github.event.pull_request.user.login == 'anthropic-claude[bot]' ||
          github.event.pull_request.user.login == 'vtempest'
        )
      )

    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      changed: ${{ steps.resolve.outputs.changed }}

    steps:
      - name: Resolve PR metadata and enforce safety rules
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
          fi

          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "::error::pr_number must be numeric."
            exit 1
          }

          pr="$(gh pr view "$PR_NUMBER" --repo "$EVENT_REPOSITORY" --json \
            number,state,isDraft,author,headRefName,headRepository,baseRefName)"

          state="$(jq -r '.state' <<<"$pr")"
          draft="$(jq -r '.isDraft' <<<"$pr")"
          author="$(jq -r '.author.login // ""' <<<"$pr")"
          head_repo="$(jq -r '.headRepository.nameWithOwner // ""' <<<"$pr")"
          head_ref="$(jq -r '.headRefName' <<<"$pr")"
          base_ref="$(jq -r '.baseRefName' <<<"$pr")"

          [[ "$state" == "OPEN" ]] || {
            echo "::error::PR #$PR_NUMBER is not open."
            exit 1
          }

          [[ "$draft" == "false" ]] || {
            echo "::error::PR #$PR_NUMBER is a draft."
            exit 1
          }

          [[ "$head_repo" == "$EVENT_REPOSITORY" ]] || {
            echo "::error::Refusing fork PR: $head_repo"
            exit 1
          }

          case "$author" in
            "claude[bot]"|"anthropic-claude[bot]"|"vtempest")
              ;;
            *)
              echo "::error::PR author '$author' is not an allowed Claude actor."
              exit 1
              ;;
          esac

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

          printf 'Processing PR #%s\n  head: %s\n  base: %s\n  author: %s\n' \
            "$PR_NUMBER" "$head_ref" "$base_ref" "$author"

      - name: Configure Git identity
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch only the base and PR branches
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          git init .
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"

          # Do not execute code from the PR in this privileged workflow.
          git fetch --no-tags origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"

          git checkout --detach "refs/remotes/origin/${HEAD_REF}"

      - name: Merge base locally; conflicts accept incoming base
        id: resolve
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail

          before="$(git rev-parse HEAD)"
          base="refs/remotes/origin/${BASE_REF}"

          # HEAD is the PR branch ("ours").
          # The incoming base branch is "theirs".
          if ! git merge --no-edit -X theirs "$base"; then
            # A failed merge is not necessarily a merge conflict.
            if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "::error::Merge failed without entering conflict resolution."
              exit 1
            fi

            echo "Policy: use the base branch for every unresolved path."

            while IFS= read -r -d '' path; do
              printf 'Resolving: %s\n' "$path"

              if git ls-files -u -- "$path" |
                awk '$3 == 3 { found=1 } END { exit(found ? 0 : 1) }'; then
                git checkout --theirs -- "$path"
                git add -- "$path"
              else
                git rm -f -- "$path"
              fi
            done < <(git diff --name-only --diff-filter=U -z)

            if [[ -n "$(git ls-files -u)" ]]; then
              echo "::error::Unresolved paths remain."
              git diff --name-only --diff-filter=U
              exit 1
            fi

            git commit --no-edit
          fi

          after="$(git rev-parse HEAD)"

          if [[ "$after" != "$before" ]]; then
            echo "Pushing merge/conflict-resolution commit to $HEAD_REF"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR branch already includes the current base branch."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "head_sha=$after" >> "$GITHUB_OUTPUT"

  approve-and-merge:
    name: Approve and merge
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Stop after changing the branch so the updated commit can be checked.
    if: needs.prepare.outputs.changed == 'false'

    steps:
      - name: Wait for checks
        id: checks
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          SELF_WORKFLOW: ${{ github.workflow }}
          TIMEOUT_MINUTES: "30"
          POLL_SECONDS: "30"
        shell: bash
        run: |
          set -euo pipefail

          echo "ready=false" >> "$GITHUB_OUTPUT"
          deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))

          while true; do
            pr="$(gh pr view "$PR_NUMBER" \
              --json state,isDraft,headRefOid,statusCheckRollup)"

            state="$(jq -r '.state' <<<"$pr")"
            draft="$(jq -r '.isDraft' <<<"$pr")"
            current_head="$(jq -r '.headRefOid' <<<"$pr")"

            if [[ "$state" != "OPEN" || "$draft" != "false" ]]; then
              echo "::notice::PR is no longer open and ready for review."
              exit 0
            fi

            if [[ "$current_head" != "$EXPECTED_HEAD_SHA" ]]; then
              echo "::notice::PR head changed; skipping this run's merge."
              exit 0
            fi

            checks="$(jq -c --arg self "$SELF_WORKFLOW" '
              [
                .statusCheckRollup[]?
                | {
                    name: (.name // .context // "unknown"),
                    workflow: (.workflowName // ""),
                    status: (.status // "COMPLETED"),
                    conclusion: (
                      ((.conclusion // .state) // "") | ascii_upcase
                    )
                  }
                | select(.workflow != $self)
              ]
            ' <<<"$pr")"

            failed="$(jq -r '
              [
                .[]
                | select(
                    .conclusion
                    | IN(
                        "FAILURE",
                        "TIMED_OUT",
                        "CANCELLED",
                        "ACTION_REQUIRED",
                        "STARTUP_FAILURE",
                        "ERROR",
                        "STALE"
                      )
                  )
                | .name
              ]
              | join(", ")
            ' <<<"$checks")"

            if [[ -n "$failed" ]]; then
              echo "::error::Checks failed: $failed"
              exit 1
            fi

            pending="$(jq -r '
              [
                .[]
                | select(
                    .status != "COMPLETED" or
                    (
                      .conclusion
                      | IN("SUCCESS", "NEUTRAL", "SKIPPED")
                      | not
                    )
                  )
                | .name
              ]
              | join(", ")
            ' <<<"$checks")"

            if [[ -z "$pending" ]]; then
              echo "No pending or failed external checks reported."
              echo "ready=true" >> "$GITHUB_OUTPUT"
              break
            fi

            if (( $(date +%s) >= deadline )); then
              echo "::error::Timed out waiting for: $pending"
              exit 1
            fi

            echo "Still pending: $pending"
            sleep "$POLL_SECONDS"
          done

      - name: Auto-approve
        if: steps.checks.outputs.ready == 'true'
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr review "$PR_NUMBER" --approve \
            --body "Automatically approved eligible Claude PR after checks." \
            || echo "Approval was not accepted or was not required."

      - name: Merge PR
        if: steps.checks.outputs.ready == 'true'
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --match-head-commit "$EXPECTED_HEAD_SHA" \
            || gh pr merge "$PR_NUMBER" \
              --squash \
              --auto \
              --delete-branch \
              --match-head-commit "$EXPECTED_HEAD_SHA"

  maintain-pull-requests:
    name: Merge eligible PRs and create missing PRs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.pr_number == ''
      )

    steps:
      - name: Resolve default branch
        id: repository
        shell: bash
        run: |
          set -euo pipefail

          base_branch="$(gh repo view "$GH_REPO" \
            --json defaultBranchRef --jq '.defaultBranchRef.name')"

          [[ -n "$base_branch" ]] || {
            echo "::error::Could not resolve the default branch."
            exit 1
          }

          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"

      - name: Merge eligible existing pull requests
        shell: bash
        run: |
          set -euo pipefail

          prs="$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --limit 1000 \
            --json number,isDraft,headRefOid,mergeStateStatus,reviewDecision,statusCheckRollup)"

          while IFS=$'\t' read -r pr_number head_sha; do
            [[ -n "$pr_number" ]] || continue

            echo "Attempting to merge PR #${pr_number}"

            gh pr merge "$pr_number" \
              --repo "$GH_REPO" \
              --merge \
              --delete-branch \
              --auto \
              --match-head-commit "$head_sha" \
              || echo "Could not merge PR #${pr_number}; repository requirements may still apply."
          done < <(
            jq -r '
              .[]
              | select(.isDraft == false)
              | select(.mergeStateStatus == "CLEAN")
              | select(
                  (.reviewDecision // "") == "APPROVED" or
                  (.reviewDecision // "") == ""
                )
              | select(
                  all(
                    .statusCheckRollup[]?;
                    (
                      .__typename == "CheckRun" and
                      .status == "COMPLETED" and
                      (
                        .conclusion == "SUCCESS" or
                        .conclusion == "SKIPPED" or
                        .conclusion == "NEUTRAL"
                      )
                    ) or
                    (
                      .__typename == "StatusContext" and
                      .state == "SUCCESS"
                    )
                  )
                )
              | [.number, .headRefOid]
              | @tsv
            ' <<<"$prs"
          )

      - name: Create pull requests for branches without one
        env:
          BASE_BRANCH: ${{ steps.repository.outputs.base_branch }}
        shell: bash
        run: |
          set -euo pipefail

          git init -q .
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"

          git fetch --quiet --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*'

          base_sha="$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")"

          while IFS= read -r branch; do
            [[ "$branch" != "HEAD" && "$branch" != "$BASE_BRANCH" ]] \
              || continue

            open_pr="$(gh pr list \
              --repo "$GH_REPO" \
              --state open \
              --head "$branch" \
              --json number \
              --jq 'length')"

            merged_pr="$(gh pr list \
              --repo "$GH_REPO" \
              --state merged \
              --head "$branch" \
              --json number \
              --jq 'length')"

            if (( open_pr > 0 || merged_pr > 0 )); then
              echo "Skipping ${branch}: an open or previously merged PR exists."
              continue
            fi

            branch_sha="$(git rev-parse "refs/remotes/origin/${branch}")"

            if git merge-base --is-ancestor "$branch_sha" "$base_sha"; then
              echo "Skipping ${branch}: already contained in ${BASE_BRANCH}."
              continue
            fi

            echo "Creating PR for ${branch} -> ${BASE_BRANCH}"

            gh pr create \
              --repo "$GH_REPO" \
              --head "$branch" \
              --base "$BASE_BRANCH" \
              --title "Merge ${branch} into ${BASE_BRANCH}" \
              --body "Automated pull request for branch \`${branch}\`."
          done < <(
            git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/origin
          )

  delete-branch:
    name: Delete merged branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: >
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Delete merged head branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail

          default_branch="$(gh repo view "$GH_REPO" \
            --json defaultBranchRef --jq '.defaultBranchRef.name')"

          if [[ "$HEAD_REF" == "$BASE_REF" ||
                "$HEAD_REF" == "$default_branch" ]]; then
            echo "::notice::Refusing to delete the base or default branch."
            exit 0
          fi

          encoded_ref="$(jq -rn --arg ref "$HEAD_REF" '$ref | @uri')"
          endpoint="repos/${GH_REPO}/git/refs/heads/${encoded_ref}"

          if ! gh api "$endpoint" >/dev/null 2>&1; then
            echo "Branch is absent or could not be inspected; skipping deletion."
            exit 0
          fi

          gh api "$endpoint" -X DELETE