name: Auto-merge Claude PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      (github.actor == 'claude[bot]' ||
       github.actor == 'anthropic-claude[bot]' ||
       github.actor == 'vtempest')
    steps:
      - name: Auto-approve
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Hand the wait off to GitHub: `--auto` queues the merge and lets it fire
      # once required checks pass. Polling from inside this job would deadlock,
      # because this job is itself one of the PR's checks.
      - name: Queue auto-merge
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "Queueing auto-merge for PR #$PR_NUMBER"

          if ! gh pr merge "$PR_NUMBER" --squash --auto --delete-branch; then
            echo "::warning::Could not queue auto-merge for PR #$PR_NUMBER. Enable 'Allow auto-merge' in the repository settings, or merge manually."
          fi

  delete-branch:
    runs-on: ubuntu-latest
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete head branch
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          gh api "repos/${{ github.repository }}/git/refs/heads/$BRANCH" -X DELETE ||
            echo "Branch $BRANCH was already deleted."
