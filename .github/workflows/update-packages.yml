name: Update Bun packages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1" # Weekly, Monday 16:00 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bun-package-updates
  cancel-in-progress: false

jobs:
  update:
    name: Update workspace dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo is a Bun workspace (packageManager: bun@1.4.2) with no pnpm
      # lockfile, so setup-node's `cache: pnpm` failed with "Unable to locate
      # executable file: pnpm" before any update ran.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Update dependencies
        run: bun run scripts/update-dependencies.ts

      - name: Remove generated lockfiles
        run: |
          git restore --worktree --staged -- bun.lock bun.lockb 2>/dev/null || true
          find . -name bun.lock -o -name bun.lockb | while read -r lockfile; do
            git rm --cached --ignore-unmatch "$lockfile" 2>/dev/null || true
            rm -f "$lockfile"
          done

      - name: Create or update dependency-update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Bun dependencies"
          branch: "automation/bun-dependency-updates"
          delete-branch: true
          title: "chore(deps): update Bun dependencies"
          body: |
            Automated dependency update using `bun update --latest`.

            This workflow scans the repository for `package.json` files, updates the
            root Bun workspace recursively, and updates standalone projects found in
            subdirectories outside the workspace.
          labels: dependencies, automated
          draft: false
