name: Update Bun packages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1" # Weekly, Monday 16:00 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bun-package-updates
  cancel-in-progress: false

jobs:
  update:
    name: Update workspace dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo is a Bun workspace (packageManager: bun@1.4.2) with no pnpm
      # lockfile, so setup-node's `cache: pnpm` failed with "Unable to locate
      # executable file: pnpm" before any update ran.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Find package manifests and update dependencies
        shell: bash
        run: |
          set -euo pipefail

          # Exclude dependency/vendor/generated directories. Each remaining package.json
          # is treated as an independent Bun project unless it belongs to the root workspace.
          mapfile -d '' manifests < <(
            find . \
              -type d \( -name node_modules -o -name .git -o -name vendor -o -name dist -o -name build -o -name .next \) -prune -o \
              -type f -name package.json -print0
          )

          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No package.json files found."
            exit 0
          fi

          printf 'Found package manifests:\n'
          printf ' - %s\n' "${manifests[@]}"

          # First update the root workspace. --recursive updates every workspace package.
          bun update --latest --recursive

          # Workspace member directories, resolved from the root "workspaces" globs
          # (single-level "*" and "!" exclusions, which is all the root uses).
          mapfile -t members < <(node -e '
            const fs = require("fs"), path = require("path");
            const globs = require("./package.json").workspaces ?? [];
            const expand = (g) => g.endsWith("/*")
              ? (fs.existsSync(g.slice(0, -2)) ? fs.readdirSync(g.slice(0, -2)).map((d) => path.join(g.slice(0, -2), d)) : [])
              : [g];
            const excluded = new Set(globs.filter((g) => g.startsWith("!")).flatMap((g) => expand(g.slice(1))));
            for (const g of globs.filter((g) => !g.startsWith("!")))
              for (const d of expand(g))
                if (!excluded.has(d) && fs.existsSync(path.join(d, "package.json"))) console.log("./" + d);
          ')
          declare -A skip
          for m in "${members[@]}"; do skip[$m]=1; done

          # Update package directories outside the root workspace.
          for manifest in "${manifests[@]}"; do
            dir="$(dirname "$manifest")"
            [ "$dir" = "." ] && continue
            if [ -n "${skip[$dir]:-}" ]; then
              echo "Skipping workspace package: $dir"
              continue
            fi
            skip[$dir]=1

            echo "Updating standalone package: $dir"
            (cd "$dir" && bun update --latest) || echo "::warning::bun update failed in $dir"
          done

      - name: Create or update dependency-update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Bun dependencies"
          branch: "automation/bun-dependency-updates"
          delete-branch: true
          title: "chore(deps): update Bun dependencies"
          body: |
            Automated dependency update using `bun update --latest`.

            This workflow scans the repository for `package.json` files, updates the
            root Bun workspace recursively, and updates standalone projects found in
            subdirectories outside the workspace.
          labels: dependencies, automated
          draft: false
