name: Tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vitest + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --ignore-scripts

      # debate-editor tracks only its patch and overlay; its src/ is assembled
      # from the submodule by its postinstall, which --ignore-scripts skips.
      - name: Assemble debate-editor's sources
        working-directory: .
        run: node packages/debate-editor/scripts/sync-upstream.mjs

      - name: Type-check every package
        run: bun run typecheck

      - name: Run package test suites with coverage
        run: bun run coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
