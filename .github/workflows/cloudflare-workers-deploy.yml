name: Build and deploy web and .com apps to Cloudflare Workers

on:
  push:
    # `master` is this repository's default branch, and every other workflow
    # already keys off it. This one listened on `main`, a branch that does not
    # exist here, so no push ever deployed — production only moved when someone
    # ran the workflow by hand.
    branches:
      - master
    paths:
      - 'apps/**'
      - '.github/workflows/cloudflare-workers-deploy.yml'

  workflow_dispatch:
    inputs:
      app:
        description: 'Optional directory name under apps/. Leave empty to deploy all directories containing web or .com.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.select.outputs.apps }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select deployable apps
        id: select
        shell: bash
        env:
          REQUESTED_APP: ${{ inputs.app }}
        run: |
          set -euo pipefail

          # A directory is deployable when it carries a Wrangler config; the
          # name is no guide. `debate-web-ext` matches a 'web' glob but is a
          # browser extension with no Worker, so `wrangler deploy` would fail
          # on it.
          has_wrangler() {
            local dir="apps/$1"
            [[ -f "${dir}/wrangler.jsonc" || -f "${dir}/wrangler.json" || -f "${dir}/wrangler.toml" ]]
          }

          if [[ -n "${REQUESTED_APP}" ]]; then
            if [[ ! -d "apps/${REQUESTED_APP}" ]]; then
              echo "::error::Directory apps/${REQUESTED_APP} does not exist."
              exit 1
            fi
            if ! has_wrangler "${REQUESTED_APP}"; then
              echo "::error::apps/${REQUESTED_APP} has no wrangler.jsonc/.json/.toml, so it is not a Workers app."
              exit 1
            fi
            apps=$(jq -cn --arg app "${REQUESTED_APP}" '[ $app ]')
          else
            apps=$(
              for dir in apps/*/; do
                app=$(basename "${dir}")
                if has_wrangler "${app}"; then echo "${app}"; fi
              done | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
          fi

          if [[ "${apps}" == "[]" ]]; then
            echo "::error::No directories under apps/ contain a Wrangler config."
            exit 1
          fi

          echo "Deploying: ${apps}"
          echo "apps=${apps}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Build and deploy ${{ matrix.app }}
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # Workspace deps hoist to the repo root, so the install has to run
      # there rather than in apps/<app>; the root bun.lock is the only
      # lockfile in the repo.
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      # `--if-present` has to precede the script name: after it, bun stops
      # parsing flags and forwards the rest to the script, so the app's build
      # chain ended up running `cp ... --if-present` and failing.
      - name: Build app
        run: bun run --if-present build

      # Migrations run first, and on their own step, so a schema change that
      # fails to apply stops the deploy rather than shipping code whose columns
      # are not there yet. `scripts/migrate-d1.ts` records what it has already
      # applied, so a steady-state deploy is a single read. Leaving this out is
      # how production drifts: the runner has existed since the last drift, but
      # only `bun run deploy` called it — this workflow went straight to
      # `wrangler deploy`, so every migration merged since then never landed.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `--if-present` has to precede the script name (see the build step
        # above); an app without a `db:migrate:d1` script has nothing to do.
        run: bun run --if-present db:migrate:d1

      - name: Deploy Worker with Wrangler
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
