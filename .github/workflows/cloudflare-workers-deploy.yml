name: Build
on:
  push:
    # `master` is this repository's default branch, and every other workflow
    # already keys off it. This one listened on `main`, a branch that does not
    # exist here, so no push ever deployed — production only moved when someone
    # ran the workflow by hand.
    branches:
      - master
    paths:
      - 'apps/**'
      # The app bundles every workspace package, so a package-only change
      # (Debate Editor, a debate-* library) is a deploy too. Without
      # this, merging one never reached production.
      - 'packages/**'
      - '.github/workflows/cloudflare-workers-deploy.yml'

  workflow_dispatch:
    inputs:
      app:
        description: 'Optional directory name under apps/. Leave empty to deploy every app that has a Wrangler config.'
        required: false
        type: string
      require_tests:
        description: 'Block this deploy if any test fails, even when the REQUIRE_TESTS_TO_DEPLOY repository variable is off.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.select.outputs.apps }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select deployable apps
        id: select
        shell: bash
        env:
          REQUESTED_APP: ${{ inputs.app }}
        run: |
          set -euo pipefail

          # A directory is deployable when it carries a Wrangler config. The
          # name is no guide in either direction, and the old `grep -Ei
          # 'web|\.com'` filter got it wrong both ways across the repos this
          # workflow is copied into: `debate-web-ext` matched but is a browser
          # extension with no Worker, so `wrangler deploy` failed on it, while
          # `qwk-in-lobe` carries a wrangler.jsonc and was never deployed at
          # all.
          has_wrangler() {
            local dir="apps/$1"
            [[ -f "${dir}/wrangler.jsonc" || -f "${dir}/wrangler.json" || -f "${dir}/wrangler.toml" ]]
          }

          # An app that declares its own workspace root is a self-contained
          # project with its own package manager, not something this job can
          # install. `apps/qwk-in-lobe` in qwksearch-research-agent is the case
          # this exists for: a vendored LobeChat fork pinning pnpm@10.33.0 with
          # its own pnpm-workspace.yaml, packages/ and patches/. It carries a
          # wrangler.jsonc, so the config test alone selects it, and the build
          # then dies on `pnpm --filter @lobehub/workbench build` — pnpm is not
          # installed and bun did not apply its patches. That app has its own
          # workflow (.github/workflows/lobehub-engine.yml), which the repo
          # documents as "the one job in this repository that installs
          # apps/qwk-in-lobe".
          owns_its_workspace() {
            [[ -f "apps/$1/pnpm-workspace.yaml" ]]
          }

          deployable() {
            has_wrangler "$1" && ! owns_its_workspace "$1"
          }

          if [[ -n "${REQUESTED_APP}" ]]; then
            if [[ ! -d "apps/${REQUESTED_APP}" ]]; then
              echo "::error::Directory apps/${REQUESTED_APP} does not exist."
              exit 1
            fi

            if ! has_wrangler "${REQUESTED_APP}"; then
              echo "::error::apps/${REQUESTED_APP} has no wrangler.jsonc/.json/.toml, so it is not a Workers app."
              exit 1
            fi

            if owns_its_workspace "${REQUESTED_APP}"; then
              echo "::error::apps/${REQUESTED_APP} declares its own pnpm-workspace.yaml and is built by its own workflow, not this one."
              exit 1
            fi

            apps=$(jq -cn --arg app "${REQUESTED_APP}" '[ $app ]')
          else
            apps=$(
              for dir in apps/*/; do
                [[ -d "${dir}" ]] || continue
                app=$(basename "${dir}")
                if deployable "${app}"; then echo "${app}"; fi
              done | jq -Rsc 'split("\n") | map(select(length > 0))'
            )
          fi

          # Not an error. This workflow is copied into repositories that have
          # no Workers app at all — GRAB-URL is one — and failing the run there
          # made it permanently red for a repository with nothing to deploy.
          # The deploy job is skipped instead.
          if [[ "${apps}" == "[]" ]]; then
            echo "No directory under apps/ is a Worker this job can build — nothing to deploy."
            find apps -mindepth 1 -maxdepth 1 -type d -printf ' - %f\n' 2>/dev/null || true
            echo "apps=[]" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Deploying: ${apps}"
          echo "apps=${apps}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Build and deploy ${{ matrix.app }}
    needs: discover
    # `fromJSON('[]')` is not an empty matrix to Actions, it is an error
    # ("Matrix vector 'app' does not contain any values"), so the job has to be
    # skipped before the matrix is evaluated.
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      # Full history: the docs build reads each page's last Git commit for
      # its "Last revised" date (packages/debate-help-docs/lib/mdx/
      # git-last-modified.ts). A shallow clone gives no dates.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Workspace deps hoist to the repo root, so the install has to run
      # there rather than in apps/<app>. No lockfile is committed; deps
      # resolve fresh from package.json. The npm registry sometimes answers
      # 502 mid-install, which failed the #1322 deploy, so retry a few times
      # before giving up.
      - name: Install dependencies
        working-directory: .
        run: |
          for attempt in 1 2 3; do
            bun install && exit 0
            echo "::warning::bun install failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          bun install

      # The full Vitest suite runs on every deploy. Whether a failure stops the
      # deploy is set by the `REQUIRE_TESTS_TO_DEPLOY` repository variable
      # (Settings > Secrets and variables > Actions > Variables), or by the
      # `require_tests` input on a manual run:
      #   - off (default, unset or anything but `true`): failures are reported
      #     as a warning and in the run summary, and the deploy goes ahead.
      #   - `true`: any failing test fails this job, so nothing is migrated or
      #     deployed.
      # It is off by default because the suite still has a few known failures
      # (rankings data, the browser extension) that should not hold production.
      - name: Run tests
        working-directory: .
        env:
          REQUIRE_TESTS_TO_DEPLOY: ${{ (inputs.require_tests || vars.REQUIRE_TESTS_TO_DEPLOY == 'true') && 'true' || 'false' }}
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/vitest.log"
          status=0
          bun run --if-present test 2>&1 | tee "${log}" || status=$?

          {
            echo "### Tests"
            echo
            echo "REQUIRE_TESTS_TO_DEPLOY: \`${REQUIRE_TESTS_TO_DEPLOY}\`"
            echo
            echo '```'
            grep -E '^ *(Test Files|Tests) ' "${log}" || echo "(no Vitest summary found)"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${status}" -eq 0 ]]; then
            echo "All tests passed."
            exit 0
          fi

          if [[ "${REQUIRE_TESTS_TO_DEPLOY}" == "true" ]]; then
            echo "::error::Tests failed and REQUIRE_TESTS_TO_DEPLOY is on, so this deploy is stopped."
            exit "${status}"
          fi

          echo "::warning::Tests failed (exit ${status}). REQUIRE_TESTS_TO_DEPLOY is off, so the deploy continues."
          echo "**Tests failed; deploying anyway because REQUIRE_TESTS_TO_DEPLOY is off.**" >> "${GITHUB_STEP_SUMMARY}"

      # `--if-present` has to precede the script name: after it, bun stops
      # parsing flags and forwards the rest to the script, so the app's build
      # chain ended up running `cp ... --if-present` and failing.
      #
      # `NEXT_PUBLIC_*` vars are inlined into the client bundle at build time,
      # so Amplitude's key has to be in this step's env: a variable set only on
      # the Worker in Cloudflare reaches server code at runtime, never the
      # browser. The key is Amplitude's public, ingestion-scoped project key; a
      # repo variable of the same name overrides it.
      - name: Build app
        env:
          NEXT_PUBLIC_AMPLITUDE_API_KEY: ${{ vars.NEXT_PUBLIC_AMPLITUDE_API_KEY || 'b23bf3283bf5a81e2802bf01c1c0b8bb' }}
          # Browser Sentry DSN (instrumentation-client.ts); public, inlined at build.
          # Unset = browser error monitoring off. The Worker reads SENTRY_DSN at runtime.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: bun run --if-present build

      # Migrations run first, and on their own step, so a schema change that
      # fails to apply stops the deploy rather than shipping code whose columns
      # are not there yet. `.github/scripts/migrate-d1.ts` records what it has already
      # applied, so a steady-state deploy is a single read. Leaving this out is
      # how production drifts: the runner has existed since the last drift, but
      # only `bun run deploy` called it — this workflow went straight to
      # `wrangler deploy`, so every migration merged since then never landed.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `--if-present` has to precede the script name (see the build step
        # above); an app without a `db:migrate:d1` script has nothing to do.
        run: bun run --if-present db:migrate:d1

      # Keep every build's hashed chunks reachable after it is replaced. A
      # Worker version's assets layer only holds its own build, so without
      # this a tab opened before the deploy (or before a rollback) 404s on its
      # next lazy chunk and crashes with "Failed to fetch dynamically imported
      # module". The Worker serves asset misses from this bucket
      # (lib/redirects/missing-build-file.ts). Runs before the deploy because
      # it also creates the bucket the BUILD_ARCHIVE binding needs. Only apps
      # that have the script's binding run it. A failed upload does not hold
      # the deploy back (the next deploy retries the missing files); a bucket
      # that could not be created fails the deploy step below on the binding.
      - name: Archive build assets
        continue-on-error: true
        if: hashFiles(format('apps/{0}/lib/redirects/missing-build-file.ts', matrix.app)) != ''
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for attempt in 1 2 3; do
            node ../../.github/scripts/archive-build-assets.mjs && exit 0
            echo "::warning::archiving build assets failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1

      # Retry Cloudflare API errors that can be transient (the opaque
      # `An unknown error has occurred [code: 10002]`) and network failures;
      # anything else fails on the first attempt. If 10002 repeats on every
      # attempt, check `Total Upload` first: runs 992-994 hit it because the
      # Worker reached 63.85 MiB of Cloudflare's 64 MiB cap, and Cloudflare
      # reported that as 10002 rather than a size error (see
      # serverDropsOrtWasm in apps/debate-web/vite.config.ts).
      - name: Deploy Worker with Wrangler
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/wrangler-deploy.log"
          for attempt in 1 2 3; do
            if bunx wrangler deploy 2>&1 | tee "${log}"; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]] && grep -Eq 'code: (10002|10013)\]|fetch failed|ECONNRESET|ETIMEDOUT|socket hang up|50[234] ' "${log}"; then
              echo "::warning::Cloudflare API returned a transient error (attempt ${attempt}), retrying"
              sleep $((attempt * 20))
              continue
            fi
            exit 1
          done
