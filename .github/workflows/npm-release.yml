name: Release debate-api-client to npm

on:
  push:
    tags:
      - "debate-api-client@*"
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under
        required: false
        default: latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-debate-api-client
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/debate-api-client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: .
        run: bun install --ignore-scripts

      - name: Type-check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify package version matches tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#debate-api-client@}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version ($tag_version) does not match package.json version ($pkg_version)"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance --tag "${{ github.event.inputs.tag || 'latest' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
