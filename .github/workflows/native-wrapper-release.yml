name: Native Wrapper Release

# Builds apps/debate-native-wrapper for every desktop platform (Windows, macOS
# universal, Linux) plus a best-effort Android .aab and iOS .ipa, attaches the
# installers to a GitHub Release, and publishes it.
#
# Two ways to run it:
#   - Push a `native-wrapper-v*.*.*` tag (a distinct prefix from any web-app
#     release tags this repo uses elsewhere). The tag must match the app
#     version in tauri.conf.json.
#   - Run it manually (workflow_dispatch). The version is read from
#     tauri.conf.json and the release `native-wrapper-v<version>` is created
#     (tagged at the commit the run was started from) and published. Untick
#     "publish" for a build-only test run that uploads nothing.
#
# Three-stage shape, same reasoning as debate/debate-editor's own
# .github/workflows/release.yml: `prepare-release` creates one draft up front
# so the parallel build jobs all upload into it instead of racing to create
# their own drafts, and `publish-release` takes it out of draft once the
# builds are done.
#
# Release naming (tag prefix, title, notes) comes from the profile's
# `release` block. GitHub reads `on:` before any file, so the tag pattern
# below is the one copy of `release.tagPrefix` that has to be kept in step by
# hand; scripts/configure.mjs fails if they disagree.

on:
  push:
    tags:
      - "native-wrapper-v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create and publish the native-wrapper-v<version> release (uncheck for a build-only test with no upload)"
        type: boolean
        default: true

concurrency:
  group: native-wrapper-release-${{ github.ref }}

env:
  # The app's one config file; see apps/debate-native-wrapper/profiles/README.md.
  PROFILE: apps/debate-native-wrapper/profiles/debate-ai.json

jobs:
  prepare-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/native-wrapper-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      # The updater (src-tauri/src/updater.rs) only offers a build whose
      # version is newer than the installed one, and that version comes from
      # the profile, not the tag. On a tag push, a tag that disagrees with it
      # would publish a release that installed apps either ignore or keep
      # re-offering, so that is an error. On a manual run the tag is derived
      # from the app version, so the two always agree.
      - name: Work out the tag and version
        id: version
        run: |
          APP_VERSION="$(jq -r .version apps/debate-native-wrapper/src-tauri/tauri.conf.json)"
          if [ -z "$APP_VERSION" ] || [ "$APP_VERSION" = "null" ]; then
            echo "::error::Could not read \"version\" from apps/debate-native-wrapper/src-tauri/tauri.conf.json." >&2
            exit 1
          fi
          TAG_PREFIX="$(jq -r '.release.tagPrefix // "native-wrapper-v"' "$PROFILE")"
          RELEASE_NAME="$(jq -r '.release.name // "\(.appName) Native"' "$PROFILE")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            TAG_VERSION="${TAG#"$TAG_PREFIX"}"
            if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
              echo "::error::Tag $TAG is version $TAG_VERSION but the app is $APP_VERSION — bump \"version\" in $PROFILE, run 'bun run configure', and tag again." >&2
              exit 1
            fi
          else
            TAG="${TAG_PREFIX}${APP_VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure draft release exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
        run: |
          NOTES="$(jq -r '.release.notes // "Desktop + mobile installers for \(.appName)."' "$PROFILE")"
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if ! gh release view "$TAG" --json id -q .id > /tmp/release_id 2>/dev/null; then
            # --target pins the tag to this commit when the release is
            # published; it is what lets a manual run (no tag yet) work, and
            # is ignored when the tag already exists.
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME $VERSION" \
              --notes "$NOTES Version $VERSION." \
              $PRERELEASE_FLAG
            gh release view "$TAG" --json id -q .id > /tmp/release_id
          fi
          echo "id=$(cat /tmp/release_id)" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build desktop (${{ matrix.os }})
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
          - os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview/build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/debate-native-wrapper/src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        # This package sits outside the root package.json's workspaces
        # (`packages/*` + `apps/debate-ai.com`), so a root-level install
        # never creates its node_modules — tauri-action and the mobile
        # jobs all need @tauri-apps/cli resolvable from inside it.
        working-directory: apps/debate-native-wrapper
        run: bun install --ignore-scripts

      # The "Offline" source (profiles/debate-ai.json's `sources`): the whole
      # debate-ai.com app bundled into dist/offline/ by
      # scripts/build-offline.mjs. It needs the monorepo installed (plus the
      # two submodules debate-webview imports from). Best-effort: if it
      # fails, the app ships without it and the splash opens the site instead.
      - name: Build the offline source
        continue-on-error: true
        run: |
          git submodule update --init --depth 1 packages/debate-rankings-sync-data packages/debate-editor-cm
          bun install
          cd apps/debate-native-wrapper && bun scripts/build-offline.mjs

      # tauri.conf.json and the icon set are already checked in for the
      # active profile (native-wrapper-ci.yml's verify-configuration job
      # guarantees they're in sync) — no configure/icons step needed here.
      # macOS signing + notarization and Windows Authenticode signing.
      # Each secret is exported only when it is set: GitHub passes an unset
      # secret as an empty string, and the Tauri bundler treats an empty
      # APPLE_CERTIFICATE as "import this certificate" and fails with
      # "failed to import the signing certificate as a PKCS#12". With none
      # set, macOS gets an ad-hoc-signed build (Gatekeeper's "unidentified
      # developer" warning on first launch) and Windows an unsigned
      # .exe/.msi (a SmartScreen warning). See docs/APP_STORES.md.
      - name: Export the platform signing secrets that are set
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
            value="${!name}"
            [ -n "$value" ] || continue
            # Heredoc form, since a base64 certificate can span lines.
            delimiter="EOF_$(openssl rand -hex 16)"
            { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: once the profile has an updater pubkey,
          # tauri.conf.json sets bundle.createUpdaterArtifacts and every
          # bundle (.app.tar.gz, NSIS -setup.exe, .AppImage) gets a .sig made
          # with this key; the build fails if the key is missing, rather than
          # shipping updates no installed app could verify. Unused while the
          # profile's pubkey is empty. See docs/UPDATES.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/debate-native-wrapper
          # tauri-action otherwise picks npm and runs `npm run tauri build`;
          # this repo uses bun, and the script is package.json's "tauri".
          tauriScript: bun run tauri
          # The tag comes from prepare-release (the pushed tag, or
          # native-wrapper-v<version> on a manual run). Empty when
          # prepare-release was skipped (a build-only test run), in which case
          # nothing is uploaded.
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: ${{ needs.prepare-release.outputs.version != '' && format('{0} {1}', needs.prepare-release.outputs.release_name, needs.prepare-release.outputs.version) || '' }}
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseDraft: true
          args: ${{ matrix.args }}
          # Each matrix job merges its platforms into the draft's latest.json
          # (with the tag in the URLs, so they keep working once the draft is
          # published). Installed apps read it only after it is copied to the
          # update feed when the release is published:
          # native-wrapper-updates.yml. Build-only test runs have no
          # release, so nothing is uploaded.
          includeUpdaterJson: true
          # Both the NSIS -setup.exe and the .msi are built; the updater uses
          # NSIS, which is what bundle.windows.nsis installs per user.
          updaterJsonPreferNsis: true

  build-android:
    name: Build Android (.aab, best-effort)
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the long-retired "tools"
          # package, which current sdkmanager rejects ("Failed to find
          # package 'tools'") and fails the job before anything builds.
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;28.0.13004108"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/debate-native-wrapper/src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        # This package sits outside the root package.json's workspaces
        # (`packages/*` + `apps/debate-ai.com`), so a root-level install
        # never creates its node_modules — tauri-action and the mobile
        # jobs all need @tauri-apps/cli resolvable from inside it.
        working-directory: apps/debate-native-wrapper
        run: bun install --ignore-scripts

      # The "Offline" source (profiles/debate-ai.json's `sources`): the whole
      # debate-ai.com app bundled into dist/offline/ by
      # scripts/build-offline.mjs. It needs the monorepo installed (plus the
      # two submodules debate-webview imports from). Best-effort: if it
      # fails, the app ships without it and the splash opens the site instead.
      - name: Build the offline source
        continue-on-error: true
        run: |
          git submodule update --init --depth 1 packages/debate-rankings-sync-data packages/debate-editor-cm
          bun install
          cd apps/debate-native-wrapper && bun scripts/build-offline.mjs

      - name: Generate the gen/android project
        working-directory: apps/debate-native-wrapper
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: npx @tauri-apps/cli@2 android init

      - name: Decode release keystore (skips signing if not configured)
        id: keystore
        working-directory: apps/debate-native-wrapper
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/release.keystore
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build .aab
        working-directory: apps/debate-native-wrapper
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: npx @tauri-apps/cli@2 android build --aab

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-wrapper-android
          path: apps/debate-native-wrapper/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Attach to release
        if: needs.prepare-release.outputs.release_id != '' && steps.keystore.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          shopt -s globstar nullglob
          files=(apps/debate-native-wrapper/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$TAG" "${files[@]}" --clobber
          fi
        # Unsigned/debug-signed .aab files aren't installable from Play, so
        # they're uploaded as a workflow artifact (above) for inspection but
        # only attached to the GitHub Release once real signing secrets are
        # configured. See docs/APP_STORES.md for Play Console's Play App
        # Signing enrollment, which is where ANDROID_KEYSTORE_BASE64 and
        # friends come from.

  build-ios:
    name: Build iOS (.ipa, best-effort)
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/debate-native-wrapper/src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        # This package sits outside the root package.json's workspaces
        # (`packages/*` + `apps/debate-ai.com`), so a root-level install
        # never creates its node_modules — tauri-action and the mobile
        # jobs all need @tauri-apps/cli resolvable from inside it.
        working-directory: apps/debate-native-wrapper
        run: bun install --ignore-scripts

      # The "Offline" source (profiles/debate-ai.json's `sources`): the whole
      # debate-ai.com app bundled into dist/offline/ by
      # scripts/build-offline.mjs. It needs the monorepo installed (plus the
      # two submodules debate-webview imports from). Best-effort: if it
      # fails, the app ships without it and the splash opens the site instead.
      - name: Build the offline source
        continue-on-error: true
        run: |
          git submodule update --init --depth 1 packages/debate-rankings-sync-data packages/debate-editor-cm
          bun install
          cd apps/debate-native-wrapper && bun scripts/build-offline.mjs

      # `ios init` refuses to run without a development team, so with no
      # APPLE_TEAM_ID secret the job only compiles the Rust core below.
      - name: Generate the gen/apple project
        id: init
        working-directory: apps/debate-native-wrapper
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_DEVELOPMENT_TEAM" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPLE_TEAM_ID is not set — skipping the Xcode project and the .ipa."
            exit 0
          fi
          npx @tauri-apps/cli@2 ios init
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # Split into two tiers on purpose, because unlike Android there is no
      # such thing as a useful unsigned iOS build: Xcode refuses to archive
      # without a team, so a fork with no Apple Developer account would get
      # nothing at all from this job. Compiling the Rust core for real
      # device hardware needs no account and is the part a source change can
      # actually break (a desktop-only dependency slipping past the cfg
      # gates in Cargo.toml, say) — everything past it is packaging and
      # signing, which only an enrolled team can exercise.
      - name: Compile the iOS core (aarch64-apple-ios)
        working-directory: apps/debate-native-wrapper/src-tauri
        run: cargo build --release --target aarch64-apple-ios

      - name: Import signing certificate + provisioning profile (skips .ipa if not configured)
        id: signing
        if: steps.init.outputs.configured == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing secrets are not set — skipping the .ipa. The iOS core compiled in the step above."
            exit 0
          fi
          # A dedicated throwaway keychain, rather than the login one, so the
          # imported private key dies with the runner.
          KEYCHAIN="$RUNNER_TEMP/native-wrapper-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on a GUI keychain-access prompt
          # that a headless runner can never answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Prepend to the user search list rather than replacing it, so
          # anything else on the runner that expects the login keychain
          # still finds it. Built as an array because the paths come back
          # quoted and indented, one per line.
          SEARCH_LIST=("$KEYCHAIN")
          while IFS= read -r kc; do
            kc="$(printf '%s' "$kc" | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')"
            if [ -n "$kc" ]; then
              SEARCH_LIST+=("$kc")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${SEARCH_LIST[@]}"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d \
            > "$PROFILE_DIR/native-wrapper.mobileprovision"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build .ipa
        if: steps.signing.outputs.configured == 'true'
        working-directory: apps/debate-native-wrapper
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: npx @tauri-apps/cli@2 ios build --export-method app-store-connect

      - name: Upload artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-wrapper-ios
          path: apps/debate-native-wrapper/src-tauri/gen/apple/**/*.ipa
          if-no-files-found: warn

      - name: Attach to release
        if: needs.prepare-release.outputs.release_id != '' && steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          # `find` rather than a `**` glob: the macOS runners' default bash is
          # 3.2, which has no globstar.
          IPA="$(find apps/debate-native-wrapper/src-tauri/gen/apple -name '*.ipa' | head -n 1)"
          if [ -n "$IPA" ]; then
            gh release upload "$TAG" "$IPA" --clobber
          fi
        # An App Store *submission* still needs the Guideline 4.2 "minimum
        # functionality" question in docs/APP_STORES.md answered — this job
        # only produces the .ipa, it does not upload to App Store Connect.

  # Unsigned .ipa for sideloading (AltStore, Sideloadly, ...), which re-sign it
  # with the installer's own Apple ID, so no Apple Developer membership is
  # needed. `tauri ios init` insists on a development team, so a placeholder
  # is passed. `tauri ios build --no-sign` then archives with
  # CODE_SIGNING_ALLOWED=NO and zips the .app into an .ipa itself. (Signing
  # can't be switched off through XCODE_XCCONFIG_FILE: the Tauri CLI runs
  # xcodebuild with its own environment, so the variable never reaches it.)
  # Best-effort: the whole job is allowed to fail without blocking the release.
  build-ios-unsigned:
    name: Build iOS unsigned .ipa (sideload, best-effort)
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/debate-native-wrapper/src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: apps/debate-native-wrapper
        run: bun install --ignore-scripts

      - name: Build the offline source
        continue-on-error: true
        run: |
          git submodule update --init --depth 1 packages/debate-rankings-sync-data packages/debate-editor-cm
          bun install
          cd apps/debate-native-wrapper && bun scripts/build-offline.mjs

      - name: Generate the gen/apple project (placeholder team)
        working-directory: apps/debate-native-wrapper
        env:
          APPLE_DEVELOPMENT_TEAM: AAAAAAAAAA
        run: npx @tauri-apps/cli@2 ios init

      - name: Archive and package without code signing
        working-directory: apps/debate-native-wrapper
        env:
          APPLE_DEVELOPMENT_TEAM: AAAAAAAAAA
        run: npx @tauri-apps/cli@2 ios build --no-sign

      - name: Name the .ipa
        id: package
        run: |
          VERSION="$(jq -r .version apps/debate-native-wrapper/src-tauri/tauri.conf.json)"
          NAME="$(jq -r .productName apps/debate-native-wrapper/src-tauri/tauri.conf.json | tr ' ' '.')"
          IPA="$(find apps/debate-native-wrapper/src-tauri/gen/apple/build -name '*.ipa' | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "::error::tauri ios build --no-sign finished without producing an .ipa." >&2
            exit 1
          fi
          OUT="$GITHUB_WORKSPACE/${NAME}_${VERSION}_unsigned-sideload.ipa"
          cp "$IPA" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-wrapper-ios-unsigned
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: warn

      - name: Attach to release
        if: needs.prepare-release.outputs.release_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          IPA: ${{ steps.package.outputs.path }}
        run: gh release upload "$TAG" "$IPA" --clobber

  # Final stage: once every build job has finished, check that the draft has
  # the installers attached and publish it. Android/iOS are best-effort, so
  # only the desktop matrix has to succeed; a failed mobile job just means
  # that artifact is missing from the release. prepare-release only runs when
  # a release is wanted (tag push, or a manual run with "publish" ticked), so
  # its success is what gates this job.
  publish-release:
    name: Publish release
    needs: [prepare-release, build-desktop, build-android, build-ios, build-ios-unsigned]
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.build-desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify the draft has installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          gh release view "$TAG" --json assets -q '.assets[].name' | tee /tmp/assets.txt
          # One installer per desktop platform.
          missing=0
          for pattern in '\.dmg$|\.app\.tar\.gz$' '\.exe$|\.msi$' '\.AppImage$|\.deb$|\.rpm$'; do
            if ! grep -Eq "$pattern" /tmp/assets.txt; then
              echo "::error::No release asset matches /$pattern/ — refusing to publish." >&2
              missing=1
            fi
          done
          # latest.json (and the .sig files) only exist once the profile has an
          # updater pubkey, so require the manifest only when updater
          # signatures were produced.
          if grep -Eq '\.sig$' /tmp/assets.txt && ! grep -Eq '^latest\.json$' /tmp/assets.txt; then
            echo "::error::Updater signatures are attached but latest.json is missing — refusing to publish." >&2
            missing=1
          fi
          # The .ipa is attached by build-ios, and only when the Apple team ID,
          # signing certificate and provisioning profile secrets are all set.
          # With them set, a missing .ipa is a failure; without them it is
          # reported so the gap is visible instead of silent.
          # The unsigned sideload .ipa (build-ios-unsigned) doesn't count here.
          if ! grep -E '\.ipa$' /tmp/assets.txt | grep -Fvq 'unsigned-sideload'; then
            if [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_CERTIFICATE" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
              echo "::error::iOS signing secrets are set but no .ipa is attached — check the Build iOS job. Refusing to publish." >&2
              missing=1
            else
              echo "::warning::No .ipa on the release: set APPLE_TEAM_ID, APPLE_CERTIFICATE (+ _PASSWORD) and IOS_PROVISIONING_PROFILE_BASE64 to build and attach one." >&2
            fi
          fi
          exit $missing

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          FLAGS=(--draft=false)
          if [[ "$VERSION" == *-* ]]; then
            FLAGS+=(--prerelease)
          else
            FLAGS+=(--latest=false)
          fi
          gh release edit "$TAG" "${FLAGS[@]}"
          echo "Published $TAG: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"