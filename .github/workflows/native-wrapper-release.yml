name: Native Wrapper and Browser Extension Release

# Builds the native wrapper for desktop and mobile, builds the browser
# extension, and attaches the resulting packages to one GitHub Release.
#
# Triggers:
#   - Push a native-wrapper-v*.*.* tag matching the native app version.
#   - Run manually with publish enabled to create/publish that version's release.
#   - Run manually with publish disabled for a build-only test.
#
# Desktop builds and the browser extension must succeed before publishing.
# Mobile builds are best-effort, except that configured iOS signing requires
# a signed .ipa to be attached before publication.
#
# Updater .sig files are not published: tauri-action uploads one per bundle,
# and the normalize step deletes them all before the release goes public
# (the updater reads its signatures inline from latest.json).
# The updater manifest (latest.json) is retained as a workflow artifact.
#
# Replace the existing native-wrapper release workflow with this file and
# remove .github/workflows/release-debate-extension.yml to avoid separate
# extension releases.

on:
  push:
    tags:
      - "native-wrapper-v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create and publish the native-wrapper-v<version> release (uncheck for a build-only test with no release upload)"
        type: boolean
        default: true

concurrency:
  group: native-wrapper-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROFILE: apps/debate-native-wrapper/profiles/debate-ai.json

jobs:
  prepare-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/native-wrapper-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag and version
        shell: bash
        run: |
          APP_VERSION="$(jq -r .version apps/debate-native-wrapper/src-tauri/tauri.conf.json)"
          if [ -z "$APP_VERSION" ] || [ "$APP_VERSION" = "null" ]; then
            echo "::error::Could not read \"version\" from apps/debate-native-wrapper/src-tauri/tauri.conf.json." >&2
            exit 1
          fi
          TAG_PREFIX="$(jq -r '.release.tagPrefix // "native-wrapper-v"' "$PROFILE")"
          RELEASE_NAME="$(jq -r '.release.name // "\(.appName) Native"' "$PROFILE")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            TAG_VERSION="${TAG#"$TAG_PREFIX"}"
            if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
              echo "::error::Tag $TAG is version $TAG_VERSION but the app is $APP_VERSION — bump \"version\" in $PROFILE, run 'bun run configure', and tag again." >&2
              exit 1
            fi
          else
            TAG="${TAG_PREFIX}${APP_VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
        id: version

      - name: Ensure draft release exists
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
        run: |
          NOTES="$(jq -r '.release.notes // "Desktop + mobile installers for \(.appName)."' "$PROFILE")"
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME $VERSION" \
              --notes "$NOTES Version $VERSION. Includes the browser extension ZIP." \
              $PRERELEASE_FLAG
          fi
          # `gh release view --json id` returns the GraphQL node id (RE_...),
          # but the REST API and tauri-action need the numeric release id.
          # Drafts aren't served by /releases/tags/{tag}, so search the list.
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | awk 'NR == 1')"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "::error::Could not find a numeric release id for $TAG"
            exit 1
          fi
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build-extension:
    name: Build browser extension
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    env:
      EXTENSION_DIR: apps/debate-browser-ext
      BUILD_DIR: .output/chrome-mv3

    steps:
      # Workspace dependencies need both submodules before bun install.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install; then
              exit 0
            fi
            echo "::warning::bun install failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          bun install

      - name: Build extension
        working-directory: ${{ env.EXTENSION_DIR }}
        run: bun run build

      - name: Validate and package extension
        id: package
        run: |
          set -euo pipefail

          BUILD_PATH="$GITHUB_WORKSPACE/$EXTENSION_DIR/$BUILD_DIR"
          MANIFEST="$BUILD_PATH/manifest.json"

          if [[ ! -f "$MANIFEST" ]]; then
            echo "::error::Missing manifest.json at $MANIFEST. Update BUILD_DIR to the extension's actual build output."
            exit 1
          fi

          VERSION=$(bun -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!manifest.version) {
              throw new Error("manifest.json must contain a version");
            }
            process.stdout.write(manifest.version);
          ' "$MANIFEST")

          ASSET_NAME="debate-browser-extension-${VERSION}.zip"
          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"

          # ZIP the contents, not the containing directory.
          cd "$BUILD_PATH"
          zip -r "$ASSET_PATH" .

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: debate-browser-extension
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error

      - name: Attach extension to release
        if: needs.prepare-release.outputs.release_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ASSET_PATH" --clobber

  build-desktop:
    name: Build desktop (${{ matrix.os }})
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
          - os: windows-latest
            args: "--target aarch64-pc-windows-msvc"
          - os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview/build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.args == '--target aarch64-pc-windows-msvc' && 'aarch64-pc-windows-msvc' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/debate-native-wrapper/src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # The wrapper is outside the root workspaces, so install it separately.
      - name: Install dependencies
        working-directory: apps/debate-native-wrapper
        run: bun install --ignore-scripts

      - name: Build the offline source
        continue-on-error: true
        run: |
          git submodule update --init --depth 1 packages/debate-rankings-sync-data packages/debate-editor-cm
          bun install
          cd apps/debate-native-wrapper && bun scripts/build-offline.mjs

      # Export only configured secrets; empty certificate values can cause
      # the bundler to attempt to import an empty certificate.
      - name: Export the platform signing secrets that are set
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
            value="${!name}"
            [ -n "$value" ] || continue
            delimiter="EOF_$(openssl rand -hex 16)"
            { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/debate-native-wrapper
          tauriScript: bun run tauri
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: ${{ needs.prepare-release.outputs.version != '' && format('{0} {1}', needs.prepare-release.outputs.release_name, needs.prepare-release.outputs.version) || '' }}
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseDraft: true
          args: ${{ matrix.args }}
          includeUpdaterJson: false

  build-android:
    name: Build Android (.aab, best-effort)
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;28.0.13004108"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/debate-native-wrapper/src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: apps/debate-native-wrapper
        run: bun install --ignore-scripts

      - name: Build the offline source
        continue-on-error: true
        run: |
          git submodule update --init --depth 1 packages/debate-rankings-sync-data packages/debate-editor-cm
          bun install
          cd apps/debate-native-wrapper && bun scripts/build-offline.mjs

      - name: Generate the gen/android project
        working-directory: apps/debate-native-wrapper
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: npx @tauri-apps/cli@2 android init

      - name: Decode release keystore (skips signing if not configured)
        id: keystore
        working-directory: apps/debate-native-wrapper
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/release.keystore
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build .aab
        working-directory: apps/debate-native-wrapper
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
        run: npx @tauri-apps/cli@2 android build --aab

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-wrapper-android
          path: apps/debate-native-wrapper/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Attach to release
        if: needs.prepare-release.outputs.release_id != '' && steps.keystore.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          shopt -s globstar nullglob
          files=(apps/debate-native-wrapper/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$TAG" "${files[@]}" --clobber
          fi

  build-ios:
    name: Build iOS (.ipa, best-effort)
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/debate-native-wrapper/src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: apps/debate-native-wrapper
        run: bun install --ignore-scripts

      - name: Build the offline source
        continue-on-error: true
        run: |
          git submodule update --init --depth 1 packages/debate-rankings-sync-data packages/debate-editor-cm
          bun install
          cd apps/debate-native-wrapper && bun scripts/build-offline.mjs

      - name: Generate the gen/apple project
        id: init
        working-directory: apps/debate-native-wrapper
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_DEVELOPMENT_TEAM" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPLE_TEAM_ID is not set — skipping the Xcode project and the .ipa."
            exit 0
          fi
          npx @tauri-apps/cli@2 ios init
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Compile the iOS core (aarch64-apple-ios)
        working-directory: apps/debate-native-wrapper/src-tauri
        run: cargo build --release --target aarch64-apple-ios

      - name: Import signing certificate + provisioning profile (skips .ipa if not configured)
        id: signing
        if: steps.init.outputs.configured == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing secrets are not set — skipping the .ipa. The iOS core compiled in the step above."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/native-wrapper-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$APPLE_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          SEARCH_LIST=("$KEYCHAIN")
          while IFS= read -r kc; do
            kc="$(printf '%s' "$kc" | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')"
            if [ -n "$kc" ]; then
              SEARCH_LIST+=("$kc")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${SEARCH_LIST[@]}"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d \
            > "$PROFILE_DIR/native-wrapper.mobileprovision"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build .ipa
        if: steps.signing.outputs.configured == 'true'
        working-directory: apps/debate-native-wrapper
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: npx @tauri-apps/cli@2 ios build --export-method app-store-connect

      - name: Upload artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-wrapper-ios
          path: apps/debate-native-wrapper/src-tauri/gen/apple/**/*.ipa
          if-no-files-found: warn

      - name: Attach to release
        if: needs.prepare-release.outputs.release_id != '' && steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          IPA="$(find apps/debate-native-wrapper/src-tauri/gen/apple -name '*.ipa' | head -n 1)"
          if [ -n "$IPA" ]; then
            gh release upload "$TAG" "$IPA" --clobber
          fi

  build-ios-unsigned:
    name: Build iOS unsigned .ipa (sideload, best-effort)
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/debate-native-wrapper/src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: apps/debate-native-wrapper
        run: bun install --ignore-scripts

      - name: Build the offline source
        continue-on-error: true
        run: |
          git submodule update --init --depth 1 packages/debate-rankings-sync-data packages/debate-editor-cm
          bun install
          cd apps/debate-native-wrapper && bun scripts/build-offline.mjs

      - name: Generate the gen/apple project (placeholder team)
        working-directory: apps/debate-native-wrapper
        env:
          APPLE_DEVELOPMENT_TEAM: AAAAAAAAAA
        run: npx @tauri-apps/cli@2 ios init

      - name: Archive and package without code signing
        working-directory: apps/debate-native-wrapper
        env:
          APPLE_DEVELOPMENT_TEAM: AAAAAAAAAA
        run: npx @tauri-apps/cli@2 ios build --no-sign

      - name: Name the .ipa
        id: package
        run: |
          VERSION="$(jq -r .version apps/debate-native-wrapper/src-tauri/tauri.conf.json)"
          NAME="$(jq -r .productName apps/debate-native-wrapper/src-tauri/tauri.conf.json | tr ' ' '.')"
          IPA="$(find apps/debate-native-wrapper/src-tauri/gen/apple/build -name '*.ipa' | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "::error::tauri ios build --no-sign finished without producing an .ipa." >&2
            exit 1
          fi
          OUT="$GITHUB_WORKSPACE/${NAME}_${VERSION}_unsigned-sideload.ipa"
          cp "$IPA" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-wrapper-ios-unsigned
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: warn

      - name: Attach to release
        if: needs.prepare-release.outputs.release_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          IPA: ${{ steps.package.outputs.path }}
        run: gh release upload "$TAG" "$IPA" --clobber

  publish-release:
    name: Publish release
    needs:
      - prepare-release
      - build-desktop
      - build-extension
      - build-android
      - build-ios
      - build-ios-unsigned
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.build-desktop.result == 'success' &&
      needs.build-extension.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Read the extension version from its manifest
        id: ext-version
        run: |
          echo "version=$(jq -r .version apps/debate-browser-ext/package.json)" >> "$GITHUB_OUTPUT"

      # Deletes every updater .sig asset, then renames the rest.
      - name: Remove .sig files and normalize release artifact filenames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          APP_VERSION: ${{ needs.prepare-release.outputs.version }}
          EXTENSION_VERSION: ${{ steps.ext-version.outputs.version }}
        # The script lives in the native wrapper app, not at the repo root.
        run: bun run apps/debate-native-wrapper/scripts/normalize-release-assets.ts

      - name: Verify the draft has installers and extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          EXTENSION_VERSION: ${{ steps.ext-version.outputs.version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          gh release view "$TAG" --json assets -q '.assets[].name' | tee /tmp/assets.txt

          # One installer per desktop platform, per the convention:
          # debate-ai-{version}-{platform}-{architecture}[-{variant}].{extension}
          missing=0
          for pattern in \
            '^debate-ai-'"$VERSION"'-macos-universal\.dmg$' \
            '^debate-ai-'"$VERSION"'-macos-universal\.app\.tar\.gz$' \
            '^debate-ai-'"$VERSION"'-windows-x64(-setup)?\.exe$' \
            '^debate-ai-'"$VERSION"'-windows-x64\.msi$' \
            '^debate-ai-'"$VERSION"'-linux-x64\.(deb|rpm|appimage)$'; do
            if ! grep -Eq "$pattern" /tmp/assets.txt; then
              echo "::error::No release asset matches /$pattern/ — refusing to publish." >&2
              missing=1
            fi
          done

          # Require the browser extension ZIP, using the extension's own version.
          if ! grep -Eq "^debate-ai-${EXTENSION_VERSION}-browser\.zip$" /tmp/assets.txt; then
            echo "::error::Browser extension ZIP is missing — refusing to publish." >&2
            missing=1
          fi

          # The unsigned sideload .ipa does not satisfy the signed-iOS check.
          if ! grep -E '^debate-ai-'"$VERSION"'-ios-arm64.*\.ipa$' /tmp/assets.txt | grep -Fvq 'unsigned-sideload'; then
            if [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_CERTIFICATE" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
              echo "::error::iOS signing secrets are set but no .ipa is attached — check the Build iOS job. Refusing to publish." >&2
              missing=1
            else
              echo "::warning::No signed .ipa on the release: set APPLE_TEAM_ID, APPLE_CERTIFICATE (+ _PASSWORD) and IOS_PROVISIONING_PROFILE_BASE64 to build and attach one." >&2
            fi
          fi

          exit $missing

      - name: Save latest.json as a workflow artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          mkdir -p /tmp/updater
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -Eq '^latest\.json$'; then
            gh release download "$TAG" --pattern latest.json --dir /tmp/updater --clobber
            # Update every download URL in latest.json to the normalized name.
            mapping="$(cat "$RUNNER_TEMP/normalize-mapping.json")"
            while IFS= read -r old; do
              new="$(printf '%s' "$mapping" | jq -r --arg old "$old" '.[$old] // empty')"
              [ -n "$new" ] || continue
              sed -i "s|/${old//./\\.}\"|/${new}\"|g" /tmp/updater/latest.json
            done < <(printf '%s' "$mapping" | jq -r 'keys[]')
          fi

      - name: Upload latest.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-wrapper-updater-manifest
          path: /tmp/updater/latest.json
          if-no-files-found: ignore

      - name: Confirm no updater .sig files are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -Eq '\.sig$'; then
            echo "::error::Updater .sig files are still attached — refusing to publish." >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          FLAGS=(--draft=false)
          if [[ "$VERSION" == *-* ]]; then
            FLAGS+=(--prerelease)
          else
            FLAGS+=(--latest=false)
          fi
          gh release edit "$TAG" "${FLAGS[@]}"
          echo "Published $TAG: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"