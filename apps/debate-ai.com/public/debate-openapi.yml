                  $ref: "#/components/schemas/CoachMaterialVersion"
        "401":
          description: Sign in to view your synced coach-material version history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /coach-material-versions/{versionId}:
    parameters:
      - name: versionId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: syncCoachMaterialVersion
      summary: Upsert one synced coach-material version snapshot
      tags: [Coaching]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [record]
              properties:
                record:
                  $ref: "#/components/schemas/CoachMaterialVersion"
      responses:
        "200":
          description: Upserted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        "400":
          description: Invalid JSON body, invalid record, or versionId mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in to sync coach-material version history to your account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: This version is too large to sync to your account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteCoachMaterialVersion
      summary: Delete one synced coach-material version snapshot
      tags: [Coaching]
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"
        "401":
          description: Sign in to manage your synced coach-material version history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /daily-best-card-comments:
    get:
      operationId: listDailyBestCardComments
      summary: List the current user's synced Daily Best Card comments
      tags: [Community]
      responses:
        "200":
          description: Full records, across every day.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyBestCardComment"
        "401":
          description: Sign in to view your synced comments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /daily-best-card-comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: syncDailyBestCardComment
      summary: Upsert one synced Daily Best Card comment
      tags: [Community]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  $ref: "#/components/schemas/DailyBestCardComment"
      responses:
        "200":
          description: Upserted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAck"
        "400":
          description: Invalid JSON body, invalid comment, or commentId mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in to sync comments to your account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: This comment is too large to sync to your account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDailyBestCardComment
      summary: Delete one synced Daily Best Card comment
      tags: [Community]
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"
        "401":
          description: Sign in to manage your synced comments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ErrorWithDetails:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required:
        - error

    SearchResults:
      type: object
      properties:
        results:
          type: array
          items:
            type: string
        total:
          type: integer
      required:
        - results
        - total

    LeaderboardEntry:
      type: object
      properties:
        teamName:
          type: string
          description: School and team code (e.g., "Strake Jesuit MS").
        bids:
          type: integer
          description: Number of TOC qualifying bids earned.
        students:
          type: string
          description: Student name(s) on the team.
        debateElo:
          type: number
          description: DebateDrills Elo rating (when available).
      required:
        - teamName

    DebateCard:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
          description: "Argument category: DA (Disadvantage), CP (Counterplan), K (Kritik), T (Topicality), I (Impact)."
          enum: [DA, CP, K, T, I]
        researchField:
          type: string
          description: Broad research area or topic.
        argBlock:
          type: string
        summary:
          type: string
          description: One-sentence summary of the card's main claim.
        cite_short:
          type: string
          description: Short citation (author and year).
        cite:
          type: string
          description: Full citation with journal, volume, and page numbers.
        readCount:
          type: integer
          description: Number of times this card has been read in rounds.
        highlightLength:
          type: integer
          description: Character length of highlighted (marked) text.
        textLength:
          type: integer
          description: Total character length of the card body.
        word_count:
          type: integer
          description: Word count of the card body.
        html:
          type: string
          description: "Card body as HTML with `<mark>` for highlighting and `<u>` for underlining."
        tag:
          type: string
          description: Comma-separated keyword tags.
        year:
          type: string
          description: 2-digit publication year.
        page:
          type: string
          description: Starting page number in the source.
        school:
          type: string
          description: School that produced the card.
        team:
          type: string
          description: Team code (initials of debaters).
        side:
          type: string
          description: Which side read the card.
          enum: [Aff, Neg]
        tournament:
          type: string
          description: Tournament where the card was read.
        round:
          type: string
          description: "Round identifier (e.g., round-3, elim-quarters)."
        event:
          type: string
          description: Debate event type.
          enum: [CX, LD, PF]

    SuccessResult:
      type: object
      description: Generic delete/mutation acknowledgement.
      properties:
        success:
          type: boolean
          enum: [true]
      required: [success]

    SyncAck:
      type: object
      description: |
        Upsert acknowledgement returned by the account-synced record PUT
        endpoints. Always carries the resource's id field (name varies by
        resource — see each operation's response) plus `updatedAt`.
      properties:
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true

    SavedRecordSummary:
      type: object
      description: Label-only summary used by the saved-flow/saved-round list endpoints (full data omitted; fetch by id for the full record).
      properties:
        clientId:
          type: integer
        label:
          type: string
        updatedAt:
          type: string
          format: date-time
      required: [clientId, label, updatedAt]

    VideoIssue:
      type: object
      properties:
        videoId:
          type: string
        title:
          type: string
        issue:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [videoId, issue, timestamp]

    EvidenceReuseMatch:
      type: object
      properties:
        id:
          type: string
        sourceUrl:
          type: string
        cite:
          type: string
        argBlock:
          type: string
        topic:
          type: string
      required: [id, sourceUrl]

    FlowEdit:
      type: object
      description: One live-shared-flow edit ("room") record, keyed by its caller-assigned id.
      properties:
        id:
          type: string
        flowId:
          type: integer
        boxPath:
          type: array
          items:
            type: integer
          description: Position of the edited box within the flow tree.
        authorId:
          type: string
        content:
          type: string
        timestampMs:
          type: integer
      required: [id, flowId, boxPath, authorId, timestampMs]

    UserSettings:
      type: object
      description: Account-linked app preferences. Unset fields fall back to this app's `DEFAULT_*` values.
      properties:
        debateStyle:
          type: integer
          nullable: true
        fontSize:
          type: integer
          nullable: true
        colorTheme:
          type: string
        themeMode:
          type: string
        favoriteTools:
          type: array
          items:
            type: string
        editorPreferences:
          type: object
          additionalProperties: true
        newsRead:
          type: array
          items:
            type: string
        newsLiked:
          type: array
          items:
            type: string
        wordLimitPresets:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              wordLimit:
                type: integer
        outlineFilterPresets:
          type: array
          items:
            type: object
            additionalProperties: true
        savedArgumentCollections:
          type: array
          items:
            type: object
            additionalProperties: true

    Document:
      type: object
      description: A REASON editor document row.
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        userId:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required: [id, title, content]

    WordCountRoundRecord:
      type: object
      description: A synced word-count-only practice round. Full shape defined/validated by `debate-round`'s `isValidWordCountRoundRecord`.
      properties:
        roundId:
          type: string
      required: [roundId]
      additionalProperties: true

    Flow:
      type: object
      description: A debate flow. Full shape defined/validated by `debate-round`'s `isValidFlow`.
      properties:
        id:
          type: integer
      required: [id]
      additionalProperties: true

    Round:
      type: object
      description: A practice round. Full shape defined/validated by `debate-round`'s `isValidRound`.
      properties:
        id:
          type: integer
      required: [id]
      additionalProperties: true

    JudgeDecisionRecord:
      type: object
      description: A synced AI judge decision. Full shape defined/validated by `debate-round`'s `isValidJudgeDecisionRecord`.
      properties:
        id:
          type: string
        roundId:
          type: string
      required: [id]
      additionalProperties: true

    RoundPairingRecord:
      type: object
      description: A synced round pairing/room assignment. Full shape defined/validated by `debate-round`'s `isValidRoundPairingRecord`.
      properties:
        roundId:
          type: string
      required: [roundId]
      additionalProperties: true

    StrategyRecommendationRecord:
      type: object
      description: A synced Scout-to-Strategy recommendation. Full shape defined/validated by `debate-round`'s `isValidStrategyRecommendationRecord`.
      properties:
        id:
          type: string
        matchupId:
          type: string
      required: [id]
      additionalProperties: true

    CounselPanelAssessmentRecord:
      type: object
      description: A synced AI counsel-panel vulnerability assessment. Full shape defined/validated by `debate-round`'s `isValidCounselPanelAssessmentRecord`.
      properties:
        id:
          type: string
        roundId:
          type: string
      required: [id]
      additionalProperties: true

    SpeechSendLogEntry:
      type: object
      description: A synced Speech Documents send-log entry. Full shape defined/validated by `debate-editor-cardmirror`'s `isValidSpeechSendLogEntry`.
      properties:
        id:
          type: string
      required: [id]
      additionalProperties: true

    CoachMaterial:
      type: object
      description: A synced coach material. Full shape defined/validated by `debate-speech-writer`'s `isValidCoachMaterialRecord`.
      properties:
        id:
          type: string
      required: [id]
      additionalProperties: true

    CoachMaterialVersion:
      type: object
      description: A synced coach-material version snapshot. Full shape defined/validated by `debate-speech-writer`'s `isValidCoachMaterialVersionRecord`.
      properties:
        id:
          type: string
        materialId:
          type: string
      required: [id]
      additionalProperties: true

    DailyBestCardComment:
      type: object
      description: A synced Daily Best Card comment. Full shape defined/validated by `debate-card-search`'s `isValidDailyBestCardComment`.
      properties:
        id:
          type: string
        dayKey:
          type: string
      required: [id]
      additionalProperties: true
