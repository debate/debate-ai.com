openapi: 3.1.0
info:
  title: Debate AI API
  description: API for the Debate AI platform — debate research, video archives, leaderboards, AI analysis, and reference data.
  version: 1.0.0

servers:
  - url: /api
    description: Next.js API routes

tags:
  - name: Cards
    description: Debate card search and evidence.
  - name: Videos
    description: Round video library, transcripts, and stats.
  - name: Reference Data
    description: Static/bundled reference lookups (dictionary, history, names, schools, tournaments).
  - name: AI
    description: Server-proxied AI/LLM features.
  - name: Documents
    description: REASON editor documents.
  - name: Flow Sync
    description: Live shared-flow edit transport.
  - name: Evidence Reuse
    description: Cross-device "has this already been cut" index.
  - name: Settings
    description: Account-linked app preferences.
  - name: Auth
    description: Sign-in configuration.
  - name: Admin
    description: Admin-gated operations.
  - name: Rounds
    description: Account-synced practice rounds and flows.
  - name: Coaching
    description: Coach materials and their version history.
  - name: Round Prep
    description: Round pairings, strategy recommendations, and counsel-panel assessments.
  - name: Judging
    description: AI judge decision history.
  - name: Speech Documents
    description: Speech-document send-log history.
  - name: Community
    description: Daily Best Card comment threads.
  - name: Leaderboard
    description: Contributor rankings.

paths:
  /analyze:
    post:
      operationId: analyzeContent
      summary: AI-powered debate card analysis
      description: |
        Sends debate card content to an LLM (Groq LLaMA 3.3 70B) for analysis.
        By default, it identifies the main claim, summarizes warrants, assigns a
        support score (0–10), lists flaws, and suggests a cross-examination question.
        A custom prompt can override the default analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: The debate card / research quote text to analyze.
                customPrompt:
                  type: string
                  description: Optional custom prompt to replace the default flaw-finding analysis. The content is appended after the prompt.
      responses:
        "200":
          description: Analysis result (structured JSON or raw text).
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    oneOf:
                      - type: object
                        properties:
                          summary:
                            type: string
                          warrants:
                            type: string
                          score:
                            type: integer
                            minimum: 0
                            maximum: 10
                          question:
                            type: string
                          flaws:
                            type: array
                            items:
                              type: string
                      - type: string
                        description: Raw text response when JSON parsing fails.
        "400":
          description: Missing GROQ_API_KEY environment variable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error during analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dictionary:
    get:
      operationId: getDictionary
      summary: Get the debate terminology dictionary
      description: Returns the full debate dictionary — a JSON object of debate terms and their definitions.
      responses:
        "200":
          description: Dictionary of debate terms.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /history:
    get:
      operationId: getDebateHistory
      summary: Get historical debate topics and champions
      description: |
        Returns a merged object of debate topics and national champions keyed by year.
        Combines data from `debate-topics.json` and `debate-champions.json`.
      responses:
        "200":
          description: History keyed by year with topic and champion fields.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string

  /leaderboard:
    get:
      operationId: getLeaderboard
      summary: Get debate team rankings and leaderboard
      description: |
        Returns ranked leaderboard data for a given division and year.
        For the current year (2026), merges TOC bid list data with DebateDrills Elo ratings.
        For prior years (2021–2025), returns DebateDrills Elo data only (VPF/VLD).
      parameters:
        - name: year
          in: query
          schema:
            type: string
            default: "2026"
          description: The competition year to query.
        - name: division
          in: query
          schema:
            type: string
            default: VPF
            enum: [VCX, VPF, VLD]
          description: The debate division (Varsity CX, Varsity PF, Varsity LD).
      responses:
        "200":
          description: Array of leaderboard entries, optionally with Elo ratings merged in.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
        "400":
          description: Invalid division specified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error fetching leaderboard data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetails"

  /schools:
    get:
      operationId: listSchools
      summary: Retrieve the cached list of debate schools
      description: |
        Returns the complete school list (plus optional per-format groupings) so clients can cache and localize fuzzy searches.
      responses:
        "200":
          description: School name dataset for client-side caching.
          content:
            application/json:
              schema:
                type: object
                properties:
                  all:
                    type: array
                    items:
                      type: string
                  byFormat:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  total:
                    type: integer

  /search:
    get:
      operationId: searchCards
      summary: Search debate research cards
      description: |
        Full-text search across debate evidence cards with filtering by year, school,
        team, tournament, and event. Supports scoped search (highlighted text only,
        underlined text only, summaries, block/file titles, or all text). Results
        can be sorted by relevance, read count, year, or highlight length.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Full-text search query.
        - name: sort
          in: query
          schema:
            type: string
            default: "_text_match:desc"
          description: "Sort field and direction, colon-separated. Fields: `_text_match`, `readCount`, `year`, `highlightLength`. Directions: `asc`, `desc`."
        - name: year
          in: query
          schema:
            type: string
          description: Filter by publication year (2-digit or 4-digit).
        - name: school
          in: query
          schema:
            type: string
          description: Filter by school name (case-insensitive partial match).
        - name: team
          in: query
          schema:
            type: string
          description: Filter by team code (case-insensitive partial match).
        - name: tournament
          in: query
          schema:
            type: string
          description: Filter by tournament name (case-insensitive partial match).
        - name: event
          in: query
          schema:
            type: string
          description: "Filter by event type (e.g., CX, LD, PF). Use `all` for no filter."
        - name: searchHighlighted
          in: query
          schema:
            type: string
            enum: ["0", "1"]
          description: "When `1`, restrict search to highlighted (`<mark>`) text only."
        - name: searchUnderlined
          in: query
          schema:
            type: string
            enum: ["0", "1"]
          description: "When `1`, restrict search to underlined (`<u>`) text only."
        - name: searchSummaries
          in: query
          schema:
            type: string
            enum: ["0", "1"]
          description: "When `1`, restrict search to card summaries only."
        - name: searchBlockAndFileTitles
          in: query
          schema:
            type: string
            enum: ["0", "1"]
          description: "When `1`, restrict search to argument block and research field titles."
        - name: searchAllText
          in: query
          schema:
            type: string
            enum: ["0", "1"]
          description: "When `1`, search all text fields (overrides other scope flags)."
      responses:
        "200":
          description: Search results with total count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/DebateCard"
                  total:
                    type: integer

  /sync-videos:
    get:
      operationId: syncVideos
      summary: Sync debate videos from YouTube
      description: |
        Triggers a synchronization of debate round videos from YouTube channels.
        Scrapes and imports new videos into the local dataset.
      responses:
        "200":
          description: Sync result with counts of new/updated videos.
          content:
            application/json:
              schema:
                type: object
        "500":
          description: Sync failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: string

  /tournaments:
    get:
      operationId: listTournaments
      summary: Retrieve the cached list of tournament names
      description: |
        Returns the full tournament name dataset so clients can cache it and run local fuzzy searches.
      responses:
        "200":
          description: Tournament name dataset for client-side caching.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tournaments:
                    type: array
                    items:
                      type: string
                  total:
                    type: integer

  /videos:
    get:
      operationId: listVideos
      summary: Get a page of debate videos
      description: |
        Returns one page of the debate video library. Videos are stored in SQL
        (Cloudflare D1) and filtered, searched, sorted and paginated
        server-side, so clients page through the library as the grid is
        scrolled rather than downloading the whole dataset. Season topics,
        champions and library-wide counts live on `/videos/meta`.
      parameters:
        - name: source
          in: query
          description: Restrict to `round`, `lecture`, or `all` (default).
          schema:
            type: string
            enum: [round, lecture, all]
        - name: lecturesOnly
          in: query
          description: Set to `1` to keep only videos with no numeric debate style.
          schema:
            type: string
        - name: topPicks
          in: query
          description: Set to `1` to keep only editorially selected top picks.
          schema:
            type: string
        - name: category
          in: query
          description: Lecture category slug, e.g. `demo_debates`.
          schema:
            type: string
        - name: style
          in: query
          description: Debate format — 1 Policy, 2 PF, 3 LD, 4 College.
          schema:
            type: integer
        - name: year
          in: query
          description: Season year (e.g. `2026`) or `legacy` for pre-2010 content.
          schema:
            type: string
        - name: q
          in: query
          description: Free-text search over title, channel and description.
          schema:
            type: string
        - name: ids
          in: query
          description: Comma-separated video id allow-list.
          schema:
            type: string
        - name: sort
          in: query
          description: "`Views` for most viewed, `Recency` (default) for newest first."
          schema:
            type: string
            enum: [Views, Recency]
        - name: limit
          in: query
          description: Page size; defaults to 60, capped at 200.
          schema:
            type: integer
        - name: offset
          in: query
          description: Zero-based offset of the requested page.
          schema:
            type: integer
        - name: facets
          in: query
          description: Set to `1` to include per-season and per-style counts.
          schema:
            type: string
      responses:
        "200":
          description: One page of videos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  videos:
                    type: array
                    description: |
                      Videos as positional tuples: `[videoId, title, date,
                      channel, viewCount, description, style|category,
                      tournament, roundLevel, affTeam, negTeam, affWin,
                      judgeDecision, arg1AC, arg2NR, isTopPick, speechDocsUrl]`.
                    items:
                      type: array
                      items: {}
                  total:
                    type: integer
                    description: Total videos matching the filters, across all pages.
                  offset:
                    type: integer
                  limit:
                    type: integer
                  hasMore:
                    type: boolean
                    description: Whether a further page is available.
                  facets:
                    type: object
                    description: Per-season and per-style counts, when requested.
                    properties:
                      yearCounts:
                        type: object
                        additionalProperties:
                          type: integer
                      styleCounts:
                        type: object
                        additionalProperties:
                          type: integer

  /videos/meta:
    get:
      operationId: getVideoMeta
      summary: Get video library metadata
      description: |
        Returns the small, fetch-once companion to the paginated `/videos`
        feed: library-wide counts, the lecture category cards, and the
        historical topic and champion tables.
      responses:
        "200":
          description: Video library metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    description: Library totals per source, debate style and top-pick flag.
                  lectureCategories:
                    type: array
                    description: Lecture categories with their slug, size and popularity.
                    items:
                      type: object
                  topics:
                    type: array
                    description: Historical debate resolution topics by year.
                    items:
                      type: object
                  champions:
                    type: array
                    description: National championship winners by year.
                    items:
                      type: object
                  history:
                    type: object
                    description: Topics and champions merged by season year.

  /admin/videos/seed:
    post:
      operationId: seedVideos
      summary: Load the bundled video assets into the videos table
      description: |
        Admin-gated. Upserts every video from the bundled JSON assets into the
        `videos` table that `/videos` pages over, then prunes rows the assets
        no longer carry. Safe to re-run. Until it is run the feed still serves
        correct results from the JSON assets in memory.
      responses:
        "200":
          description: Seed run completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  rows:
                    type: integer
                    description: Rows upserted.
                  statements:
                    type: integer
                  durationMs:
                    type: integer
        "403":
          description: Caller is not an admin.
    get:
      operationId: getVideoSeedStatus
      summary: Report whether the videos table is seeded
      description: Admin-gated row count and last-seeded timestamp for the `videos` table.
      responses:
        "200":
          description: Current table state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: integer
                  lastSeededAt:
                    type: integer
                    nullable: true
                  servingFrom:
                    type: string
                    enum: [sql, json]
        "403":
          description: Caller is not an admin.

  /transcript:
    get:
      operationId: getVideoTranscript
      summary: Get a YouTube video's transcript
      description: |
        Fetches captions for a YouTube video (via `extract-youtube`) for the
        video grid/transcript modal's synced captions panel.
      tags: [Videos]
      parameters:
        - name: videoId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transcript snippets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  videoId:
                    type: string
                  snippets:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                        start:
                          type: number
                        duration:
                          type: number
        "400":
          description: Missing videoId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No transcript available for this video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /names:
    get:
      operationId: listNames
      summary: Get the full list of human names
      description: Sorted, capitalized list of ~92k human first/last names, used for name-entry autocomplete.
      tags: [Reference Data]
      responses:
        "200":
          description: Name list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  names:
                    type: array
                    items:
                      type: string

  /youtube-stats:
    get:
      operationId: getYoutubeStats
      summary: Get bundled YouTube channel/video statistics
      description: Static metadata snapshot bundled at build time (view counts, subscriber counts, etc. per tracked channel).
      tags: [Videos]
      responses:
        "200":
          description: YouTube stats snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /auth/providers:
    get:
      operationId: getAuthProviders
      summary: List configured OAuth sign-in providers
      description: |
        The OAuth providers this deployment has credentials for (a subset of
        google, discord, linkedin), plus the public Google client id used to
        decide which sign-in buttons to show and whether to prompt Google One Tap.
      tags: [Auth]
      responses:
        "200":
          description: Configured providers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: string
                      enum: [google, discord, linkedin]
                  googleClientId:
                    type: string

  /video-issues:
    get:
      operationId: listVideoIssues
      summary: List reported video issues
      tags: [Videos]
      responses:
        "200":
          description: Reported issues.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      $ref: "#/components/schemas/VideoIssue"
    post:
      operationId: reportVideoIssue
      summary: Report an issue with a video
      tags: [Videos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoIssue"
      responses:
        "200":
          description: Issue recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"
        "400":
          description: Missing videoId, issue, or timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to persist the issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/youtube/resync:
    get:
      operationId: getYoutubeResyncRuns
      summary: List recent YouTube resync runs (admin)
      tags: [Admin]
      responses:
        "200":
          description: Recent resync runs, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "403":
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: resyncYoutubeVideos
      summary: Trigger a full resync of round videos (admin)
      description: Re-pulls round videos from every subscribed YouTube channel.
      tags: [Admin]
      responses:
        "200":
          description: Resync completed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Resync failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/youtube/videos:
    get:
      operationId: listAdminYoutubeVideos
      summary: Keyset-paginated list of stored round videos (admin)
      tags: [Admin]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 24, maximum: 100 }
        - name: cursor
          in: query
          description: Opaque keyset cursor from a previous response's nextCursor.
          schema: { type: string }
        - name: style
          in: query
          schema: { type: integer }
        - name: channel
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Page of videos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  videos:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  nextCursor:
                    type: string
                    nullable: true
        "403":
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /evidence-reuse-check:
    get:
      operationId: checkEvidenceReuse
      summary: Check whether a source URL has already been cut as a card
      tags: [Evidence Reuse]
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reuse check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  alreadyCut: { type: boolean }
                  matches:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvidenceReuseMatch"
        "400":
          description: Missing or invalid url.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: registerEvidenceReuse
      summary: Register a cut card's source URL in the shared reuse index
      tags: [Evidence Reuse]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EvidenceReuseMatch"
                - type: object
                  properties:
                    contributorId: { type: string }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceReuseMatch"
        "400":
          description: Missing id or sourceUrl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /flow-sync:
    get:
      operationId: pullFlowEdits
      summary: Pull live flow edits newer than a timestamp
      description: Short-poll transport for shared/live-edited flows ("rooms").
      tags: [Flow Sync]
      parameters:
        - name: flowId
          in: query
          required: true
          schema: { type: integer }
        - name: sinceMs
          in: query
          description: Only edits newer than this epoch-ms timestamp.
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Edits since sinceMs, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  edits:
                    type: array
                    items:
                      $ref: "#/components/schemas/FlowEdit"
        "400":
          description: Invalid flowId or sinceMs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: pushFlowEdit
      summary: Push one live flow edit
      description: Upserts by the caller-assigned edit id, so retried pushes are idempotent.
      tags: [Flow Sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowEdit"
      responses:
        "201":
          description: Edit stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowEdit"
        "400":
          description: Invalid edit payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reason-ai:
    post:
      operationId: reasonAiComplete
      summary: Server-proxied Anthropic Messages completion
      description: |
        Signed-in-gated passthrough to the Anthropic Messages API used by this
        app's AI features (cite formatting, OCR/PDF text repair, image alt
        text, research-coach explanations, LLM card scoring). The server holds
        the Anthropic API key; callers never see it.
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                system:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        description: A string, or an array of text/image content blocks.
                maxTokens:
                  type: integer
                  description: Capped at 16384.
                temperature:
                  type: number
      responses:
        "200":
          description: Completion text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  stopReason: { type: string }
        "400":
          description: Invalid JSON body or empty messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in to use AI features.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream Anthropic API error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: AI features are not configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /settings:
    get:
      operationId: getUserSettings
      summary: Get the current user's account-linked settings
      tags: [Settings]
      responses:
        "200":
