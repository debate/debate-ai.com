<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors chrome-extension://*;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Player</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .error {
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      padding: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("vid");
    const origin = params.get("origin");

    if (/^[A-Za-z0-9_-]{11}$/.test(id ?? "")) {
      const player = document.createElement("iframe");
      const embedParams = new URLSearchParams({
        enablejsapi: "1",
        rel: "0",
        controls: "1",
      });
      if (params.get("autoplay") === "1") embedParams.set("autoplay", "1");
      const start = params.get("start");
      if (start && /^\d+$/.test(start)) embedParams.set("start", start);
      if (origin) {
        embedParams.set("origin", origin);
        embedParams.set("widget_referrer", origin);
      }
      player.src = `https://www.youtube.com/embed/${id}?${embedParams.toString()}`;
      player.referrerPolicy = "strict-origin-when-cross-origin";
      player.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
      player.allowFullscreen = true;
      document.body.append(player);

      // Forward YouTube postMessage events to parent if same origin window context allows
      window.addEventListener("message", (event) => {
        if (event.origin !== "https://www.youtube.com") return;
        // Forward to parent
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(event.data, "*");
          }
        } catch (e) {
          // ignore
        }
      });
    } else {
      const err = document.createElement("div");
      err.className = "error";
      err.textContent = "Invalid YouTube video ID.";
      document.body.append(err);
    }
  </script>
</body>
</html>
