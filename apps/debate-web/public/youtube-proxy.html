<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors chrome-extension://*;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Player</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .error {
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      padding: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("vid");
    if (/^[A-Za-z0-9_-]{11}$/.test(id ?? "")) {
      const player = document.createElement("iframe");
      player.src = `https://www.youtube.com/embed/${id}?enablejsapi=1&rel=0&controls=1${params.get("autoplay")==="1"?"&autoplay=1":""}${params.get("start")?`&start=${params.get("start")}`:""}`;
      player.referrerPolicy = "strict-origin-when-cross-origin";
      player.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
      player.allowFullscreen = true;
      document.body.append(player);
    } else {
      const err = document.createElement("div");
      err.className = "error";
      err.textContent = "Invalid YouTube video ID.";
      document.body.append(err);
    }
  </script>
</body>
</html>
