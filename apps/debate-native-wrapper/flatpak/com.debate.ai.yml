# Generated by scripts/configure.mjs from profiles/debate-ai.json. Do not edit by hand.
# Built by scripts/build-flatpak.sh from the Tauri .deb; see docs/FLATPAK.md.
id: com.debate.ai

runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk

command: debate-ai

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: debate-ai
    buildsystem: simple

    sources:
      - type: file
        path: app.deb

      - type: file
        path: com.debate.ai.metainfo.xml

    build-commands:
      - ar x app.deb
      - mkdir -p extracted
      - tar -xf data.tar.* -C extracted

      # The Tauri binary is the only file in usr/bin; install it under a fixed name.
      - |
        bin="$(find extracted/usr/bin -maxdepth 1 -type f | head -n 1)"
        test -n "$bin"
        install -Dm755 "$bin" /app/bin/debate-ai

      # Bundled resources (Tauri puts them in usr/lib/<product name>), if any.
      - |
        if [ -d extracted/usr/lib ]; then
          mkdir -p /app/lib
          cp -a extracted/usr/lib/. /app/lib/
        fi

      - |
        desktop="$(find extracted/usr/share/applications -name '*.desktop' | head -n 1)"
        sed -E \
          -e 's/^Exec=("[^"]*"|[^ ]+)/Exec=debate-ai/' \
          -e 's/^Icon=.*/Icon=com.debate.ai/' \
          "$desktop" > com.debate.ai.desktop
      - install -Dm644 com.debate.ai.desktop /app/share/applications/com.debate.ai.desktop

      # Every plain NxN icon size the .deb ships, renamed to the Flatpak id.
      - |
        for icon in extracted/usr/share/icons/hicolor/*/apps/*.png; do
          size="$(basename "$(dirname "$(dirname "$icon")")")"
          case "$size" in
            *[!0-9x]*) continue ;;
          esac
          install -Dm644 "$icon" "/app/share/icons/hicolor/$size/apps/com.debate.ai.png"
        done

      - install -Dm644 com.debate.ai.metainfo.xml /app/share/metainfo/com.debate.ai.metainfo.xml
