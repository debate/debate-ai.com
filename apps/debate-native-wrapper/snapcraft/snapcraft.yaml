# Generated by scripts/configure.mjs from profiles/debate-ai.json. Do not edit by hand.
# Built by scripts/build-snap.sh from the Tauri .deb; see docs/SNAP.md.
name: debate-ai
title: "Debate AI"
version: "1.0.0"
summary: "Debate research, flowing and practice"
description: |
  Debate AI brings competitive debate prep for Policy, Lincoln-Douglas and Public Forum into one app.

  Search and cut evidence cards, flow live rounds, write speeches, practice against an AI opponent, run speech and prep timers, and watch the video library of past rounds.
license: "Proprietary"
website: "https://debate-ai.com"
contact: "https://github.com/debate/debate-ai.com/issues"
base: core24
grade: stable
confinement: strict
platforms:
  amd64:

parts:
  debate-ai:
    plugin: nil
    source: .
    stage-packages:
      - libayatana-appindicator3-1
      - libxdo3
    override-build: |
      dpkg-deb -x "$CRAFT_PART_SRC/app.deb" "$CRAFT_PART_INSTALL"
      cd "$CRAFT_PART_INSTALL"
      # The Tauri binary is the only file in usr/bin; give it the snap's name.
      bin="$(find usr/bin -maxdepth 1 -type f | head -n 1)"
      test -n "$bin"
      [ "$bin" = usr/bin/debate-ai ] || mv "$bin" usr/bin/debate-ai
      desktop="$(find usr/share/applications -name '*.desktop' | head -n 1)"
      icon="$(ls usr/share/icons/hicolor/128x128/apps/*.png | head -n 1)"
      sed -E \
        -e 's/^Exec=("[^"]*"|[^ ]+)/Exec=debate-ai/' \
        -e "s|^Icon=.*|Icon=\${SNAP}/$icon|" \
        "$desktop" > /tmp/debate-ai.desktop
      rm -f usr/share/applications/*.desktop
      mv /tmp/debate-ai.desktop usr/share/applications/debate-ai.desktop

apps:
  debate-ai:
    command: usr/bin/debate-ai
    desktop: usr/share/applications/debate-ai.desktop
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - audio-playback
      - audio-record
      - camera
      - home
