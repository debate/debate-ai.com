components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key from Settings → MCP server & API (/settings?category=mcp), or a session token.
  responses:
    BadRequest:
      description: The request was malformed or missing a required field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in, or the API key is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Signed in, but not allowed to do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ApiKeySummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        hint:
          type: string
          description: The last four characters of the key.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [id, name, hint, createdAt, expiresAt]
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ErrorWithDetails:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required:
        - error

    SearchResults:
      type: object
      properties:
        results:
          type: array
          items:
            type: string
        total:
          type: integer
      required:
        - results
        - total

    LeaderboardEntry:
      type: object
      properties:
        teamName:
          type: string
          description: School and team code (e.g., "Strake Jesuit MS").
        bids:
          type: integer
          description: Number of TOC qualifying bids earned.
        students:
          type: string
          description: Student name(s) on the team.
        debateElo:
          type: number
          description: DebateDrills Elo rating (when available).
      required:
        - teamName

    DebateCard:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
          description: "Argument category: DA (Disadvantage), CP (Counterplan), K (Critique), T (Topicality), I (Impact)."
          enum: [DA, CP, K, T, I]
        researchField:
          type: string
          description: Broad research area or topic.
        argBlock:
          type: string
        summary:
          type: string
          description: One-sentence summary of the card's main claim.
        cite_short:
          type: string
          description: Short citation (author and year).
        cite:
          type: string
          description: Full citation with journal, volume, and page numbers.
        readCount:
          type: integer
          description: Number of times this card has been read in rounds.
        highlightLength:
          type: integer
          description: Character length of highlighted (marked) text.
        textLength:
          type: integer
          description: Total character length of the card body.
        word_count:
          type: integer
          description: Word count of the card body.
        html:
          type: string
          description: "Card body as HTML with `<mark>` for highlighting and `<u>` for underlining."
        tag:
          type: string
          description: Comma-separated keyword tags.
        year:
          type: string
          description: 2-digit publication year.
        page:
          type: string
          description: Starting page number in the source.
        school:
          type: string
          description: School that produced the card.
        team:
          type: string
          description: Team code (initials of debaters).
        side:
          type: string
          description: Which side read the card.
          enum: [Aff, Neg]
        tournament:
          type: string
          description: Tournament where the card was read.
        round:
          type: string
          description: "Round identifier (e.g., round-3, elim-quarters)."
        event:
          type: string
          description: Debate event type.
          enum: [CX, LD, PF]

    SuccessResult:
      type: object
      description: Generic delete/mutation acknowledgement.
      properties:
        success:
          type: boolean
          enum: [true]
      required: [success]

    SyncAck:
      type: object
      description: |
        Upsert acknowledgement returned by the account-synced record PUT
        endpoints. Always carries the resource's id field (name varies by
        resource — see each operation's response) plus `updatedAt`.
      properties:
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true

    SavedRecordSummary:
      type: object
      description: Label-only summary used by the saved-flow/saved-round list endpoints (full data omitted; fetch by id for the full record).
      properties:
        clientId:
          type: integer
        label:
          type: string
        updatedAt:
          type: string
          format: date-time
      required: [clientId, label, updatedAt]

    VideoIssue:
      type: object
      properties:
        videoId:
          type: string
        title:
          type: string
        issue:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [videoId, issue, timestamp]

    EvidenceReuseMatch:
      type: object
      properties:
        id:
          type: string
        sourceUrl:
          type: string
        cite:
          type: string
        argBlock:
          type: string
        topic:
          type: string
        card:
          $ref: "#/components/schemas/ReuseCardDetails"
        annotation:
          $ref: "#/components/schemas/CardReuseAnnotation"
      required: [id, sourceUrl]

    ReuseCardDetails:
      type: object
      description: >-
        Returned on reuse-check matches registered from the Parquet card corpus
        (ids `card:<id>`) — the stored card parsed by debate-card-parser.
      properties:
        cardId: { type: integer }
        tag: { type: string }
        cite: { type: string }
        fullcite: { type: string }
        author: { type: string, nullable: true }
        year:
          description: Publication year, "ND" for no date, or null when unparsed.
          oneOf:
            - { type: integer }
            - { type: string, enum: [ND] }
          nullable: true
        quotes:
          type: array
          description: Highlighted runs, in card order.
          items: { type: string }
        caselist: { type: string }
        event: { type: string }
        level: { type: string }
        side: { type: string }
        duplicateCount: { type: integer }
      required: [cardId, tag, cite, fullcite, author, year, quotes, caselist, event, level, side, duplicateCount]

    CardReuseAnnotation:
      type: object
      properties:
        claim: { type: string }
        supportScore:
          type: integer
          description: 0-10, how well the highlighted text supports the tag.
        authorQuality:
          type: object
          properties:
            rating: { type: string, enum: [strong, adequate, weak, unknown] }
            qualifications: { type: string }
            concerns: { type: string }
          required: [rating, qualifications, concerns]
        flaws:
          type: array
          items:
            type: object
            properties:
              flaw: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              explanation: { type: string }
            required: [flaw, severity, explanation]
      required: [claim, supportScore, authorQuality, flaws]

    FlowEdit:
      type: object
      description: One live-shared-flow edit ("room") record, keyed by its caller-assigned id.
      properties:
        id:
          type: string
        flowId:
          type: integer
        boxPath:
          type: array
          items:
            type: integer
          description: Position of the edited box within the flow tree.
        authorId:
          type: string
        content:
          type: string
        timestampMs:
          type: integer
      required: [id, flowId, boxPath, authorId, timestampMs]

    UserSettings:
      type: object
      description: Account-linked app preferences. Unset fields fall back to this app's `DEFAULT_*` values.
      properties:
        debateStyle:
          type: integer
          nullable: true
        fontSize:
          type: integer
          nullable: true
        colorTheme:
          type: string
        themeMode:
          type: string
        favoriteTools:
          type: array
          items:
            type: string
        editorPreferences:
          type: object
          additionalProperties: true
        newsRead:
          type: array
          items:
            type: string
        newsLiked:
          type: array
          items:
            type: string
        wordLimitPresets:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              wordLimit:
                type: integer
        outlineFilterPresets:
          type: array
          items:
            type: object
            additionalProperties: true
        savedArgumentCollections:
          type: array
          items:
            type: object
            additionalProperties: true

    Document:
      type: object
      description: A REASON editor document row.
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        userId:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required: [id, title, content]

    Flow:
      type: object
      description: A debate flow. Full shape defined/validated by `debate-round`'s `isValidFlow`.
      properties:
        id:
          type: integer
      required: [id]
      additionalProperties: true

    Round:
      type: object
      description: A practice round. Full shape defined/validated by `debate-round`'s `isValidRound`.
      properties:
        id:
          type: integer
      required: [id]
      additionalProperties: true

    JudgeDecisionRecord:
      type: object
      description: A synced AI judge decision. Full shape defined/validated by `debate-round`'s `isValidJudgeDecisionRecord`.
      properties:
        id:
          type: string
        roundId:
          type: string
      required: [id]
      additionalProperties: true

    RoundPairingRecord:
      type: object
      description: A synced round pairing/room assignment. Full shape defined/validated by `debate-round`'s `isValidRoundPairingRecord`.
      properties:
        roundId:
          type: string
      required: [roundId]
      additionalProperties: true

    StrategyRecommendationRecord:
      type: object
      description: A synced Scout-to-Strategy recommendation. Full shape defined/validated by `debate-round`'s `isValidStrategyRecommendationRecord`.
      properties:
        id:
          type: string
        matchupId:
          type: string
      required: [id]
      additionalProperties: true

    CounselPanelAssessmentRecord:
      type: object
      description: A synced AI counsel-panel vulnerability assessment. Full shape defined/validated by `debate-round`'s `isValidCounselPanelAssessmentRecord`.
      properties:
        id:
          type: string
        roundId:
          type: string
      required: [id]
      additionalProperties: true

    SpeechSendLogEntry:
      type: object
      description: A synced Speech Documents send-log entry. Full shape defined/validated by `debate-editor-cardmirror`'s `isValidSpeechSendLogEntry`.
      properties:
        id:
          type: string
      required: [id]
      additionalProperties: true

    CoachMaterial:
      type: object
      description: A synced coach material. Full shape defined/validated by `debate-speech-writer`'s `isValidCoachMaterialRecord`.
      properties:
        id:
          type: string
      required: [id]
      additionalProperties: true

    CoachMaterialVersion:
      type: object
      description: A synced coach-material version snapshot. Full shape defined/validated by `debate-speech-writer`'s `isValidCoachMaterialVersionRecord`.
      properties:
        id:
          type: string
        materialId:
          type: string
      required: [id]
      additionalProperties: true

    DailyBestCardComment:
      type: object
      description: A synced Daily Best Card comment. Full shape defined/validated by `debate-card-search`'s `isValidDailyBestCardComment`.
      properties:
        id:
          type: string
        dayKey:
          type: string
      required: [id]
      additionalProperties: true

