  /tournaments/rest/tourns:
    get:
      operationId: listTournamentsRest
      summary: Get public tournaments
      description: |
        Retrieve public information about tournaments. Supports filtering by circuit,
        date range, and published results. Results are paginated.
      tags: [Tournaments]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 500
            default: 50
          description: Maximum number of tournaments to return (default 50, max 500)
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
          description: Number of tournaments to skip
        - name: circuit
          in: query
          schema:
            type: integer
          description: Filter tournaments to those approved in this circuit
        - name: startAfter
          in: query
          schema:
            type: string
            format: date-time
          description: Return tournaments with start date after this UTC timestamp
        - name: startBefore
          in: query
          schema:
            type: string
            format: date-time
          description: Return tournaments with start date before this UTC timestamp
        - name: fields
          in: query
          schema:
            type: string
          description: Comma-separated tournament fields (e.g., id,name,start)
        - name: fields[events]
          in: query
          schema:
            type: string
          description: Comma-separated event fields to include when requesting events
        - name: publishedResults
          in: query
          schema:
            type: boolean
          description: Filter tournaments to those with published results
      responses:
        "200":
          description: List of tournaments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tournament"
        "404":
          $ref: "#/components/responses/NotFound"

  /tournaments/rest/tourns/{tournId}:
    get:
      operationId: getTournamentRest
      summary: Get public tournament by ID
      description: Retrieve public information about a specific tournament.
