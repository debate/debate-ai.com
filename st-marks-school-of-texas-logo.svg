<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="white"/>
  
  <!-- Shield -->
  <g transform="translate(200, 200)">
    <path d="M 0,-80 L 60,-60 L 60,0 Q 60,40 0,80 Q -60,40 -60,0 L -60,-60 Z" 
          fill="#002D72" stroke="#FFD700" stroke-width="3"/>
    
    <!-- Cross -->
    <g fill="#FFD700">
      <rect x="-4" y="-50" width="8" height="40"/>
      <rect x="-12" y="-42" width="24" height="8"/>
    </g>
    
    <!-- Small accent -->
    <circle cx="0" cy="10" r="3" fill="#FFD700"/>
  </g>
  
  <!-- Text -->
  <text x="320" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#002D72">ST. MARK'S</text>
  <text x="320" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#002D72">SCHOOL OF TEXAS</text>
  <text x="320" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#666">ESTABLISHED</text>
</svg>