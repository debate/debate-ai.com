# Codecov configuration — https://docs.codecov.com/docs/codecov-yaml
#
# Coverage is produced by `bun run coverage` at the repo root, which runs every
# `packages/*/test` suite plus the apps' suites (`apps/debate-web/lib/**/__tests__`,
# `apps/debate-browser-ext/test` and `apps/debate-native-wrapper/test`) through
# Vitest and writes a single merged `coverage/lcov.info` covering both
# `packages/` and `apps/`. The native wrapper's Rust `cargo test` coverage is a
# second, flagged upload from native-wrapper-ci.yml.

codecov:
  # The Cloudflare Workers Builds check is red for reasons outside this repo;
  # waiting on all CI would stop Codecov from ever posting its report.
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "40...90"
  status:
    project:
      default:
        target: auto
        # Small refactors should not fail the build over rounding noise.
        threshold: 2%
        informational: true
    patch:
      default:
        target: 60%
        threshold: 5%
        informational: true

# One component per package, matching the per-folder rows Codecov's file tree
# shows, so each package gets its own coverage number and status. Components
# slice the single unflagged upload by path (flags would need one upload per
# package). Named after the directory, which is how contributors navigate the
# repo. Keep in sync with `packages/*`.
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 2%
        informational: true
  individual_components:
    - component_id: debate-api-client
      paths:
        - packages/debate-api-client/src/**
    - component_id: debate-card-parser
      paths:
        - packages/debate-card-parser/src/**
    - component_id: debate-comments
      paths:
        - packages/debate-comments/src/**
    - component_id: debate-contributor-progress
      paths:
        - packages/debate-contributor-progress/src/**
    - component_id: debate-editor
      paths:
        - packages/debate-editor/overlay/**
    - component_id: debate-file-market
      paths:
        - packages/debate-file-market/src/**
    - component_id: debate-flow
      paths:
        - packages/debate-flow/src/**
    - component_id: debate-practice-drills
      paths:
        - packages/debate-practice-drills/src/**
    - component_id: debate-predictions
      paths:
        - packages/debate-predictions/src/**
    - component_id: debate-rankings-adapter
      paths:
        - packages/debate-rankings-adapter/src/**
    - component_id: debate-round-practice-ai
      paths:
        - packages/debate-round-practice-ai/src/**
    - component_id: debate-round
      paths:
        - packages/debate-round/src/**
    - component_id: debate-search-evidence
      paths:
        - packages/debate-search-evidence/src/**
    - component_id: debate-speech-writer
      paths:
        - packages/debate-speech-writer/src/**
    - component_id: debate-team-collaboration
      paths:
        - packages/debate-team-collaboration/src/**
    - component_id: debate-timer
      paths:
        - packages/debate-timer/src/**
    - component_id: debate-tournaments
      paths:
        - packages/debate-tournaments/src/**
    - component_id: debate-videos
      paths:
        - packages/debate-videos/src/**
    - component_id: debate-webview-admin
      paths:
        - packages/debate-webview-admin/src/**
    - component_id: debate-webview
      paths:
        - packages/debate-webview/src/**
    # The apps. The native wrapper reports twice: its JavaScript (the profile
    # mapping and the offline host page) with everything else from Tests, and
    # its Rust from native-wrapper-ci.yml under the carried-forward
    # `native-wrapper-rust` flag below.
    - component_id: debate-web
      paths:
        - apps/debate-web/app/**
        - apps/debate-web/lib/**
        - apps/debate-web/worker/**
    - component_id: debate-browser-ext
      paths:
        - apps/debate-browser-ext/src/**
        - apps/debate-browser-ext/lib/**
        - apps/debate-browser-ext/entrypoints/**
        - apps/debate-browser-ext/components/**
    - component_id: debate-native-wrapper
      paths:
        - apps/debate-native-wrapper/scripts/**
        - apps/debate-native-wrapper/offline/**
        - apps/debate-native-wrapper/src-tauri/src/**

# The native wrapper's Rust is only built (and its coverage uploaded) when a
# push touches the wrapper, so carry its last report forward to every other
# commit rather than letting it drop out of the totals.
flag_management:
  individual_flags:
    - name: native-wrapper-rust
      paths:
        - apps/debate-native-wrapper/src-tauri/src/**
      carryforward: true

# debate-editor's src/ is assembled at install time and git-ignored, so the
# coverage report's paths there name no tracked file. Only the files its
# overlay/ supplies are measured (see apps/debate-web/vitest.config.ts), and
# this points each of them at the overlay copy the repo actually tracks.
fixes:
  - "packages/debate-editor/src/::packages/debate-editor/overlay/"

comment:
  layout: "header, diff, components, files, footer"
  behavior: default
  require_changes: false

ignore:
  - "**/*.d.ts"
  - "**/test/**"
  - "**/__tests__/**"
  - "apps/debate-web/lib/stubs/**"
  # Written by scripts/configure.mjs from the profile; its source is covered.
  - "apps/debate-native-wrapper/src-tauri/src/generated_scheme.rs"
  - "packages/debate-rankings-adapter/data/**"
  # Image assets plus one generated re-export index each; nothing to test. Its
  # editor/ folder was also where Codecov suffix-matched the vendored
  # debate-editor/src/editor/** paths (~6k lines at 15%), so ignoring it keeps
  # a stray mapping from ever showing up as an untested component again.
  - "packages/debate-icons/**"
  - "**/node_modules/**"
